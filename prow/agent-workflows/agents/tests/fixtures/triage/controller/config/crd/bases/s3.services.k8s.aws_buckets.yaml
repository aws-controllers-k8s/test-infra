apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: buckets.s3.services.k8s.aws
spec:
  group: s3.services.k8s.aws
  names:
    kind: Bucket
    plural: buckets
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
              objectLockConfiguration:
                type: object
                properties:
                  objectLockEnabled:
                    type: string
                  rule:
                    type: object
                    properties:
                      defaultRetention:
                        type: object
                        properties:
                          days:
                            type: integer
                          mode:
                            type: string
          status:
            type: object
            properties:
              location:
                type: string
