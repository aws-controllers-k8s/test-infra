# ACK Autopilot Plan 7 golden fixture: prow/agent-workflows/agent-workflows.yaml's
# add-field and (Plan 9) add-resource entries with their two placeholders resolved (images repo
# registry.example/prow, org aws-controllers-k8s). agent-plugin's generator
# (prow/plugins/agent-plugin/pkg/prowjob) and prowlaunch.Build both read it.
workflows:
    add-field:
        description: "ACK field addition workflow"
        image: registry.example/prow:add-resource-0.0.32
        command: ["/app/prow-job.sh"]
        required_args: ["service", "resource", "field"]
        optional_args: ["model", "aws-sdk-version", "work-item", "change-class", "detector-work"]
        environment:
            GITHUB_ORG: aws-controllers-k8s
            GITHUB_EMAIL_PREFIX: "327606448"
            GITHUB_ACTOR: ack-agent
        environmentFromSecrets:
            GITHUB_TOKEN:
                name: agent-github-pat-token
                key: token
        e2e: true
        timeout: "5h"
        resources:
            cpu: "6"
            memory: "10Gi"
        extra_refs:
            - org: aws-controllers-k8s
              repo: code-generator
              base_ref: main
              env: CODEGEN_DIR
            - org: aws-controllers-k8s
              repo: runtime
              base_ref: main
            - org: aws-controllers-k8s
              repo: ack-dev-skills
              base_ref: main
              env: ACK_DEV_SKILLS_DIR
            - org: aws-controllers-k8s
              repo: test-infra
              base_ref: main
              env: TEST_INFRA_DIR
    add-resource:
        description: "ACK resource addition workflow"
        image: registry.example/prow:add-resource-0.0.32
        command: ["/app/prow-job.sh"]
        required_args: ["service", "resource"]
        optional_args: ["model", "aws-sdk-version", "work-item", "change-class"]
        environment:
            GITHUB_ORG: aws-controllers-k8s
            GITHUB_EMAIL_PREFIX: "327606448"
            GITHUB_ACTOR: ack-agent
        environmentFromSecrets:
            GITHUB_TOKEN:
                name: agent-github-pat-token
                key: token
        e2e: true
        timeout: "5h"
        resources:
            cpu: "6"
            memory: "10Gi"
        extra_refs:
            - org: aws-controllers-k8s
              repo: code-generator
              base_ref: main
              env: CODEGEN_DIR
            - org: aws-controllers-k8s
              repo: runtime
              base_ref: main
            - org: aws-controllers-k8s
              repo: ack-dev-skills
              base_ref: main
              env: ACK_DEV_SKILLS_DIR
            - org: aws-controllers-k8s
              repo: test-infra
              base_ref: main
              env: TEST_INFRA_DIR
