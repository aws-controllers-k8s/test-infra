# List of service that will execute a set of tests for CARM
# These service need a CARM_ENABLED environment variable set to true
carm_test_services:
- ecr

# List of service that will execute a set of tests for IAM Role Selector (IRS)
# These service need a IAMRoleSelector feature gate to be set to true
irs_test_services:
- sqs

# List of AWS services onboarded for soak testing, executing in their Prow
# cluster on every release
soak_test_on_release_service_names: []

# List of AWS services whose controller gets generated and e2e tested whenever
# there is a new code-generator change.
# These controllers are generated and tested to validate that changes in code-generator
# are not breaking changes for service controllers. This helps surface any early
# issues with code-generator release.
# Since there can be some breaking changes, these tests are marked optional for
# prow merge criteria.
code_gen_presubmit_services:
- acm
- apigatewayv2
- cloudfront
- documentdb
- dynamodb
- ec2
- ecr
- efs
- eks
- eventbridge
- iam
- lambda
- pipes
- prometheusservice
- s3

runtime_presubmit_services:
- ecr
- iam
- s3
- ec2
- sagemaker
- sqs

# List of AWS services whose controller gets generated and e2e tested whenever
# there is a new `acktest` library change.
acktest_presubmit_services:
- ecr
- iam
- s3

# List of AWS services whose associated AWS API is monitored for changes. When
# the API changes, a GitHub issue is opened in the community repo describing
# the new resources, operations, and fields.
api_notification_services:
- s3

# Maximum number of open `ack/api-change-detected` issues this job may hold open
# in the community repo. Once reached, no new issues are created until some are
# closed; existing ones are still refreshed, since that does not grow the count.
#
# Required whenever api_notification_services is non-empty, and it must not
# exceed the length of that list: the run files at most one issue per service
# listed above, so a larger cap could only be reached by duplicate or stale
# issues — not by anything this run files — and is rejected as a typo.
# Setting it *below* the list length is fine and is the point during a rollout:
# services past the cap are logged as skipped and picked up once a slot frees, so
# adding a service here does not require raising the cap.
api_notification_max_open_issues: 1
