# This config is used to generate `jobs.yaml` file using `generator.go` and
# the Go templates.

# Controls whether periodic jobs are included in the generated jobs.yaml.
# Set to false during initial cluster bootstrap to prevent periodic jobs from
# firing before the cluster is fully operational.
periodics_enabled: true

# Routes pre-submit jobs to a dedicated Prow build cluster by name (the
# kubeconfig context, e.g. "build"). Empty => pre-submits omit the `cluster:`
# field and run on the implicit in-cluster "default" cluster (current behavior).
# Set to "build" only after the build cluster is provisioned and registered
# (buildCluster.enabled). Postsubmits/periodics always stay on "default".
presubmit_cluster: "build"

# Adding a service to the `aws_services` array will enable CI/CD

# List of AWS services supported in ACK testing infrastructure.
aws_services:
- acm
- acmpca
- apigateway
- apigatewayv2
- applicationautoscaling
- athena
- autoscaling
- backup
- bedrock
- bedrockagent
- bedrockagentcorecontrol
- cloudfront
- cloudtrail
- cloudwatch
- cloudwatchlogs
- codeartifact
- cognitoidentityprovider
- dms
- documentdb
- dsql
- dynamodb
- ec2
- ecr
- ecrpublic
- ecs
- efs
- eks
- elasticache
- elbv2
- emr
- emrcontainers
- emrserverless
- eventbridge
- firehose
- fsx
- glue
- iam
- kafka
- kinesis
- kms
- keyspaces
- lambda
- lambdacore
- lambdamicrovms
- memorydb
- mq
- mwaa
- mwaaserverless
- networkfirewall
- networkmanager
- opensearchservice
- opensearchserverless
- organizations
