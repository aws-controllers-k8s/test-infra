apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.demo.services.k8s.aws
spec:
  group: demo.services.k8s.aws
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
              config:
                type: object
                properties:
                  size:
                    type: string
              rules:
                type: array
                items:
                  type: object
                  properties:
                    prefix:
                      type: string
                    type_:
                      type: string
          status:
            type: object
            properties:
              widgetID:
                type: string
