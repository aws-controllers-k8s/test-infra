{{- $prowImagesRepoUri := required "prowImagesRepoUri is required" .Values.prowImagesRepoUri }}
{{- $testInfraOrg := required "testInfraOrg is required" .Values.testInfraOrg }}
{{- $testInfraRepo := required "testInfraRepo is required" .Values.testInfraRepo }}
{{- $testInfraBranch := required "testInfraBranch is required" .Values.testInfraBranch }}
{{- $accountId := required "accountId is required" .Values.accountId }}
{{- $region := required "region is required" .Values.region }}
{{- $controllerEcrRegistry := required "controllerEcrRegistry is required" .Values.controllerEcrRegistry }}
{{- $prowVersion := required "prowVersion is required" .Values.prowVersion }}
{{- $toolsVersion := required "toolsVersion is required" .Values.toolsVersion }}
{{- $prowPatchRevision := required "prowPatchRevision is required" .Values.prowPatchRevision }}
{{- $content := .Files.Get "job-config-job.yaml" }}
{{- if not $content }}
  {{- fail "job-config-job.yaml is missing. It is generated by `make prow-gen`; this chart renders it and cannot substitute for it." }}
{{- end }}

{{/*
  STEP 1 - protect Flux's escapes before substituting anything.

  This file contains two `$$` sequences that must NOT be treated as variables, and that Flux
  postBuild unescapes to a single `$` (the file says so itself: "The $$ prefix is escaped by
  Flux postBuild (becomes $ after substitution)"):

    envsubst '$$TEST_INFRA_ORG $$TEST_INFRA_REPO ...'   the container needs $VAR, so envsubst
                                                        restricts substitution to those names
    config.yaml: "$${GZIPPED_B64}"                      the container's shell expands it

  Helm has no unescaping step, so the chart has to reproduce it. Getting this wrong is silent
  and expensive: `$$TEST_INFRA_ORG` reaching envsubst means jobs.yaml is not substituted, and
  `$${GZIPPED_B64}` reaching bash expands `$$` to the shell PID and writes a corrupt
  job-config ConfigMap that Prow then fails to parse.

  Sentinel first so step 2 cannot match `$${...}` and step 3's guard cannot mistake it for an
  unresolved token.
*/}}
{{- $content = $content | replace "$$" "__FLUX_ESCAPED_DOLLAR__" }}

{{/* STEP 2 - resolve the real tokens. PROW_MIRROR_REGISTRY and PATCH_SUFFIX are composed in
     the file from ACCOUNT_ID/REGION and PROW_PATCH_REVISION, so they need no entry here. */}}
{{- $content = $content
      | replace "${TEST_INFRA_ORG}" $testInfraOrg
      | replace "${TEST_INFRA_REPO}" $testInfraRepo
      | replace "${TEST_INFRA_BRANCH}" $testInfraBranch
      | replace "${PROW_IMAGES_REPO_URI}" $prowImagesRepoUri
      | replace "${CONTROLLER_ECR_REGISTRY}" $controllerEcrRegistry
      | replace "${ACCOUNT_ID}" $accountId
      | replace "${REGION}" $region
      | replace "${PROW_VERSION}" $prowVersion
      | replace "${TOOLS_VERSION}" $toolsVersion
      | replace "${PROW_PATCH_REVISION}" $prowPatchRevision }}

{{/* STEP 3 - anything left is a token this chart does not know about. `replace` would leave
     it as literal text in a Deployment image or a Job env, failing far from here. */}}
{{- with regexFind "\\$\\{[A-Z_]+\\}" $content }}
  {{- fail (printf "job-config-job.yaml contains %s, which this chart does not resolve. Add a replace above and add the value to the Application in bootstrap/argocd-applications.tf." .) }}
{{- end }}

{{/* STEP 4 - unescape, exactly as Flux would. */}}
{{- $content = $content | replace "__FLUX_ESCAPED_DOLLAR__" "$" }}

{{/*
  STEP 5 - make the Job replaceable.

  Its spec.template is immutable, which is why the Flux Kustomization carries `force: true`
  ("Required to recreate the job-config-substitutor Job on each reconciliation"). Argo CD's
  equivalent is a per-resource annotation, and the Argo CD docs name this exact case: "For
  certain resources you might want to delete and recreate, e.g. job resources that should run
  every time when syncing" -> `Force=true,Replace=true`.

  Scoped to the Job by annotation rather than set on the Application, deliberately. As an
  Application-level syncOption it would apply to every object here, and Force means
  delete-and-recreate: the three ConfigMaps and the RBAC would be destroyed and rebuilt with
  new uids, which is precisely what the cutover procedure checks against. The Job is the only
  object that may be recreated, and it is ephemeral anyway - ttlSecondsAfterFinished is 300,
  so it usually does not exist.
  
  Replace also takes precedence over ServerSideApply for this object only; the rest of the
  Application keeps SSA.

  Inserted by anchoring on the Job's identity rather than by parsing and re-serialising the
  document, so the file's comments and formatting survive into the rendered output. The
  assertion below is the safety net: if the generator ever changes those four lines, `replace`
  would silently do nothing and the immutability failure would reappear later.
*/}}
{{- $anchor := "kind: Job\nmetadata:\n  name: job-config-substitutor\n  namespace: prow\n" }}
{{- $annotated := printf "%s  annotations:\n    argocd.argoproj.io/sync-options: Force=true,Replace=true\n" $anchor }}
{{- $content = $content | replace $anchor $annotated }}
{{- if not (contains "argocd.argoproj.io/sync-options: Force=true,Replace=true" $content) }}
  {{- fail "failed to annotate the job-config-substitutor Job: its metadata block no longer matches the anchor in this template. Without the annotation Argo CD cannot replace the Job and syncs will fail on its immutable spec.template." }}
{{- end }}

{{ $content | trimSuffix "\n" }}
