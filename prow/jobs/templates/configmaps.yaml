{{- $testInfraOrg := required "testInfraOrg is required" .Values.testInfraOrg }}
# The three ConfigMaps in test-pods that Prow jobs mount, replacing the configMapGenerator in
# kustomization.yaml. Names and keys are fixed: presets mount them by name, and the keys are
# the source filenames because that is what configMapGenerator produced. disableNameSuffixHash
# was set there for the same reason - a content-hash suffix breaks a mount by name.
#
# test-config is the same file the build cluster's copy renders from
# (flux/prow/charts/prow-build-cluster-resources), which is the point: one source file, two
# clusters, no drift.
#
# These are the chart's TRACKED objects, and that matters beyond their own content. The
# substitutor Job is what keeps job-config current, and jobs.yaml is deliberately not part of
# this chart, so nothing here changes when jobs.yaml does. What re-runs the Job is the Job
# itself being absent - ttlSecondsAfterFinished deletes it 300s after it finishes, which is
# drift, which selfHeal resolves by recreating it. That reproduces what Flux does today, where
# the same ttl and a 5m reconcile interval mean the Job is recreated on most reconciles.
{{- range $spec := list
      (dict "name" "test-config" "file" "test_config.yaml")
      (dict "name" "label-config" "file" "labels.yaml")
      (dict "name" "jobs-config" "file" "jobs_config.yaml") }}
{{- $content := $.Files.Get $spec.file }}
{{- if not $content }}
  {{- fail (printf "%s is missing or empty. labels.yaml is generated by `make prow-gen`; test_config.yaml and jobs_config.yaml are hand-maintained." $spec.file) }}
{{- end }}
{{- /* Only labels.yaml carries tokens - ${TEST_INFRA_ORG}, as the repo key on each entry.
       test_config.yaml and jobs_config.yaml have none, but they go through the same guard so
       a token added to either fails the render instead of reaching a mounted file. */}}
{{- $content = $content | replace "${TEST_INFRA_ORG}" $testInfraOrg }}
{{- with regexFind "\\$\\{[A-Z_]+\\}" $content }}
  {{- fail (printf "%s contains %s, which this chart does not resolve. Add a replace above and add the value to the Application in bootstrap/argocd-applications.tf." $spec.file .) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $spec.name }}
  namespace: test-pods
data:
  {{/* The chomping indicator has to follow the file. A clipped block (`|`) always yields
       exactly one trailing newline, which is right for test_config.yaml and jobs_config.yaml
       but adds a byte to labels.yaml, which the generator writes without one. That single
       byte is a real content difference to the API server, so it would show as permanent
       drift against the object kustomize produced. Strip (`|-`) when the source has no
       trailing newline. */}}
  {{ $spec.file }}: {{ if hasSuffix "\n" $content }}|{{ else }}|-{{ end }}
{{ $content | trimSuffix "\n" | indent 4 }}
{{- end }}
