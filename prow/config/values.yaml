prowJobNamespace: "prow" # Namespace in which to post the created ProwJobs
podNamespace: "test-pods" # Namespace in which to run test pods

controllerEcrRegistry: ""
ecrPublicAccountId: ""
ecrPublicReaderRoleArn: ""
stage: ""

github:
  # Per-environment: the org Prow watches. Supplied by the Application.
  organisation: ''
  # Static in every stage, so defaults here. The bot's identity and the Secret holding its PAT
  # are properties of the ACK deployment, not of an environment.
  bot:
    username: 'ack-bot'
    emailID: '82905295' # The suffix given to Github email addresses <username>-<suffix>@users.noreply.github.com
    personalAccessToken:
      secretName: 'prowjob-github-pat-token'

prow:
  domain: ''
  presubmitsBucketName: ''
  tideStatusReconcilerBucketName: ''

dryRun: false

region: 'us-west-2'

# Dedicated build cluster for pre-submit jobs (isolation from the control plane).
# Inert by default; enabled via the Flux HelmRelease (flux/prow/charts/prow-config.yaml)
# once the build cluster is provisioned. When enabled, the four components that
# schedule/clean/report on build-cluster pods (prow-controller-manager, sinker,
# crier, deck) mount a kubeconfig with a `build` context whose exec credential
# authenticates to the build cluster's API server.
buildCluster:
  # Provisioned and verified, and wired into the four components that reach it. Pre-submit routing
  # is enabled separately via presubmit_cluster in prow/jobs/jobs_config.yaml.
  enabled: true
  # Context name in the kubeconfig; MUST equal the `cluster:` field set on jobs.
  name: build
  # EKS cluster name of the build cluster (e.g. ack-test-infra-prod-build-cluster).
  clusterName: ''
  # Build cluster API server endpoint (https URL) and base64 cluster CA data.
  # Populated by Flux substitution from the provisioned cluster.
  server: ''
  certificateAuthorityData: ''
  # Where the kubeconfig ConfigMap is mounted in each component container.
  kubeconfigMountPath: /etc/kubeconfig

ingress:
  # ALB annotations, static in every environment, so they are defaults here rather than values an
  # Application supplies. That is not only convention: two of them are JSON containing commas,
  # which Argo CD's helm.parameters (passed as --set) would misparse as list separators. Keeping
  # them in git means prow-config needs no helm.values block at all - only scalars.
  #
  # external-dns.alpha.kubernetes.io/hostname is deliberately absent; the template composes it
  # from prow.domain, which the Ingress already uses as its host. It was the only per-environment
  # annotation.
  create: true
  annotations:
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/success-codes: "200-302"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-FS-1-2-Res-2020-10"

# Mirrored image coordinates, from which the chart COMPOSES each component's reference when that
# component's own `image` below is left empty.
#
# Why the chart composes them rather than being handed 13 finished strings. The reference is
# <accountId>.dkr.ecr.<region>.amazonaws.com/prow/<component>:<prowVersion>-ack.<prowPatchRevision>,
# and its four inputs have two different owners. accountId and region are per-environment and
# belong to Terraform; prowVersion and prowPatchRevision are static git-authored strings that
# Terraform has no business knowing - the same rule that put them in
# flux/prow/charts/prow-mirror/values.yaml and prow/jobs/values.yaml. Nothing outside this chart
# holds all four, so nothing outside this chart can build the string.
#
# Flux is unaffected: flux/prow/charts/prow-config.yaml passes each `image` explicitly, and an
# explicit value always wins over the composed one. Rendering with those values is byte-identical
# before and after this change.
#
# prowVersion and prowPatchRevision MUST match
# the two other charts that carry them, for as long as those copies exist. Flux's copy is gone; the
# ConfigMap and leaves the chart defaults.
imageMirror:
  # Per-environment, supplied by the Application. Left empty so composing without them fails at
  # render time rather than producing a reference to account "".
  accountId: ""
  region: ""
  prowVersion: "v20260702-fff8399c7"
  prowPatchRevision: "1"

# Prow component images. EMPTY MEANS COMPOSED from imageMirror above; set one to override it
# outright, which is what the Flux HelmRelease does for every component.
#
# These previously defaulted to the upstream registry (us-docker.pkg.dev/k8s-infra-prow/images/*)
# "for local dev/testing", but carried no tag, so rendering with the defaults produced an
# implicitly-`latest` reference that nothing ever used - every reconciler overrode all 13. Empty
# plus a composed default fails loudly instead, which is the better default for a chart whose
# images are always mirrored.
crier:
  scrapeMetrics: false
  image: ""
  serviceAccount:
    create: false
    name: 'prow-deployment-service-account'

deck:
  scrapeMetrics: false
  image: ""
  service:
    type: 'ClusterIP'
    annotations: {}
  serviceAccount:
    create: false
    name: 'prow-deployment-service-account'

ghproxy:
  scrapeMetrics: false
  image: ""
  volumeSize: 100

hook:
  scrapeMetrics: true
  image: ""
  service:
    type: 'ClusterIP'
  serviceAccount:
    create: false
    name: 'prow-deployment-service-account'

horologium:
  scrapeMetrics: false
  image: ""
  serviceAccount:
    create: false
    name: 'prow-deployment-service-account'

prowControllerManager:
  scrapeMetrics: true
  image: ""
  serviceAccount:
    create: false
    name: 'prow-deployment-service-account'

sinker:
  scrapeMetrics: false
  image: ""
  serviceAccount:
    create: false
    name: 'prow-deployment-service-account'

statusreconciler:
  image: ""
  serviceAccount:
    create: false
    name: 'prow-deployment-service-account'

tide:
  scrapeMetrics: true
  image: ""
  serviceAccount:
    create: false
    name: 'prow-deployment-service-account'

githubApp:
  secret:
   create: false
  appId: ''
  clientId: ''
  cert: ''

githubWebhookToken:
  secret:
    create: false
  hmac: ''

# Utility images, same rule: empty means composed from imageMirror.
utility_images:
  clonerefs: ""
  entrypoint: ""
  initupload: ""
  sidecar: ""
