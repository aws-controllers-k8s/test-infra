# ACK Autopilot Plan 7: what the autopilot-dispatcher ServiceAccount may put
# in a ProwJob. RBAC (rbac.yaml) cannot look inside an object, and a ProwJob
# is a pod spec Prow runs as its own identity: without this policy the
# ServiceAccount could run any image with any secret in test-pods. This policy
# applies only to that ServiceAccount's requests and allows:
#   CREATE: the five allowlisted jobs (prowlaunch.Allowed), each with exactly
#           the pod prowlaunch.Build makes for it (Plan 9 adds
#           agent-workflow-add-resource and autopilot-dod);
#   UPDATE: an abort of a job it made (status.state=aborted), nothing else.
# Apply (a human, after SECURITY-REVIEW.md) with the three values resolved:
#   envsubst '${PROW_IMAGES_REPO_URI} ${TEST_INFRA_ORG} ${PROW_LOGS_BUCKET}' \
#     < admission-policy.yaml | kubectl apply --server-side -f -
# PROW_LOGS_BUCKET is the whole URL the Dispatcher's JOB_SPEC names,
# "s3://<bucket>" (prow/config/values.yaml prowLogsBucketName, with s3://).
# No Argo CD Application or Flux Kustomization reads this directory.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: autopilot-dispatcher-prowjobs
  labels:
    app.kubernetes.io/part-of: ack-autopilot
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["prow.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["prowjobs"]
  matchConditions:
  - name: dispatcher-only
    expression: "request.userInfo.username == 'system:serviceaccount:test-pods:autopilot-dispatcher'"
  variables:
  - name: labels
    expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  - name: annotations
    expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
  # Every annotation prowlaunch.Build puts on a job (Prow copies a job's
  # annotations to its pod, so this also bounds the pod's annotations).
  - name: annotationKeys
    expression: "['workflow-agent/workflow-name', 'workflow-agent/issue-number', 'workflow-agent/command-args', 'prow.k8s.io/job', 'prow.k8s.io/refs.org', 'prow.k8s.io/refs.repo', 'prow.k8s.io/refs.pull', 'ack-autopilot/request', 'ack-autopilot/work-item', 'karpenter.sh/do-not-disrupt']"
  - name: job
    expression: "has(object.spec.job) ? object.spec.job : ''"
  - name: addField
    expression: "variables.job == 'agent-workflow-add-field'"
  - name: sdkBump
    expression: "variables.job == 'autopilot-sdk-bump'"
  - name: triage
    expression: "variables.job == 'agent-workflow-triage'"
  - name: addResource
    expression: "variables.job == 'agent-workflow-add-resource'"
  - name: dod
    expression: "variables.job == 'autopilot-dod'"
  # add-field and add-resource have agent-plugin's agent pod (Plan 9).
  - name: agentJob
    expression: "variables.addField || variables.addResource"
  # The only environment variables the dod job may have: exactly what
  # prowlaunch.Build gives it (Plan 9 review F14; deploy_test.go checks it).
  # Nothing else, so no BASH_ENV, GOFLAGS or the like reaches its script.
  - name: dodEnv
    expression: "['WORKFLOW_NAME', 'ISSUE_NUMBER', 'REPO_OWNER', 'REPO_NAME', 'ISSUE_AUTHOR', 'TEST_INFRA_ORG', 'SERVICE', 'AUTOPILOT_DOD_PR', 'AUTOPILOT_DOD_HEAD_SHA', 'AUTOPILOT_DOD_BASE_SHA', 'AUTOPILOT_DOD_PR_AUTHOR', 'AUTOPILOT_DOD_WORK_ITEM', 'AUTOPILOT_DOD_CLASS']"
  - name: pod
    expression: "object.spec.pod_spec"
  - name: container
    expression: "object.spec.pod_spec.containers[0]"
  - name: dc
    expression: "object.spec.decoration_config"
  validations:
  # --- CREATE -------------------------------------------------------------
  - expression: >-
      request.operation != 'CREATE' ||
      ('ack-autopilot/managed-by' in variables.labels &&
       variables.labels['ack-autopilot/managed-by'] == 'autopilot-dispatcher' &&
       object.metadata.name.matches('^autopilot-[0-9a-f]{16}-g[0-9]{1,4}-(r[1-9][0-9]{0,2}|f[0-9a-f]{8}|t[1-9][0-9]{0,2}|d[1-9][0-9]{0,2})$'))
    message: "a Dispatcher ProwJob is named by a launch id and labelled ack-autopilot/managed-by=autopilot-dispatcher"
  - expression: >-
      request.operation != 'CREATE' ||
      (variables.annotations.all(k, k in variables.annotationKeys) &&
       (!('karpenter.sh/do-not-disrupt' in variables.annotations) ||
        ((variables.sdkBump || variables.dod) && object.metadata.annotations['karpenter.sh/do-not-disrupt'] == 'true')))
    message: "only the annotations prowlaunch.Build sets; karpenter.sh/do-not-disrupt only as \"true\" on autopilot-sdk-bump and autopilot-dod"
  - expression: >-
      request.operation != 'CREATE' ||
      (object.spec.type == 'periodic' && object.spec.agent == 'kubernetes' &&
       (variables.addField || variables.sdkBump || variables.triage || variables.addResource || variables.dod) &&
       !has(object.spec.refs) && !has(object.spec.namespace) &&
       !has(object.spec.jenkins_spec) && !has(object.spec.pipeline_run_spec) &&
       !has(object.spec.tekton_pipeline_run_spec))
    message: "only the periodic kubernetes jobs agent-workflow-add-field, agent-workflow-add-resource, autopilot-sdk-bump, autopilot-dod and agent-workflow-triage, with no refs, namespace or other agent"
  - expression: >-
      request.operation != 'CREATE' ||
      (has(object.spec.pod_spec) && size(variables.pod.containers) == 1 &&
       !has(variables.pod.initContainers) && !has(variables.pod.ephemeralContainers) &&
       !has(variables.pod.nodeName) && !has(variables.pod.securityContext) &&
       !(has(variables.pod.hostNetwork) && variables.pod.hostNetwork) &&
       !(has(variables.pod.hostPID) && variables.pod.hostPID) &&
       !(has(variables.pod.hostIPC) && variables.pod.hostIPC) &&
       !has(variables.container.envFrom) && !has(variables.container.volumeDevices))
    message: "one container, no init or ephemeral containers, no host namespaces, no envFrom"
  - expression: >-
      request.operation != 'CREATE' || !variables.agentJob ||
      (object.spec.cluster == 'build' &&
       variables.pod.serviceAccountName == 'workflow-runner' &&
       variables.container.image.startsWith('${PROW_IMAGES_REPO_URI}:add-resource-') &&
       variables.container.command == ['/app/prow-job.sh'] &&
       object.metadata.name.matches('-g[0-9]{1,4}-r[1-9][0-9]{0,2}$'))
    message: "agent-workflow-add-field and agent-workflow-add-resource run prow-job.sh from the add-resource image on the build cluster as workflow-runner, named by a run launch id"
  - expression: >-
      request.operation != 'CREATE' || !variables.dod ||
      ((!has(object.spec.cluster) || object.spec.cluster == 'default') &&
       variables.pod.serviceAccountName == 'pre-submit-service-account' &&
       variables.container.image.startsWith('${PROW_IMAGES_REPO_URI}:prow-auto-generate-controllers-') &&
       variables.container.command == ['/bin/bash', '-c', './scripts/autopilot-dod.sh'] &&
       !has(variables.container.args) && !has(variables.container.securityContext) &&
       !has(variables.pod.volumes) && !has(variables.container.volumeMounts) &&
       (!has(variables.container.env) || variables.container.env.all(e, !has(e.valueFrom))) &&
       has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false &&
       has(variables.container.env) &&
       variables.container.env.all(e, e.name in variables.dodEnv) &&
       variables.container.env.exists(e, e.name == 'SERVICE') &&
       variables.container.env.all(e, e.name != 'SERVICE' ||
         (has(e.value) && e.value.matches('^[a-z0-9][a-z0-9-]{0,62}$'))) &&
       object.metadata.name.matches('-g[0-9]{1,4}-d[1-9][0-9]{0,2}$'))
    message: "autopilot-dod runs scripts/autopilot-dod.sh from the auto-generate-controllers image, unprivileged, as pre-submit-service-account with no ServiceAccount token, with no volume or secret, only the environment variables prowlaunch.Build sets and a service alias for SERVICE, named by a dod launch id"
  - expression: >-
      request.operation != 'CREATE' || variables.dod ||
      !object.metadata.name.matches('-d[0-9]+$')
    message: "a dod launch id names only an autopilot-dod job"
  - expression: >-
      request.operation != 'CREATE' || !variables.sdkBump ||
      ((!has(object.spec.cluster) || object.spec.cluster == 'default') &&
       variables.pod.serviceAccountName == 'periodic-service-account' &&
       variables.container.image.startsWith('${PROW_IMAGES_REPO_URI}:prow-auto-generate-controllers-') &&
       variables.container.command == ['/bin/bash', '-c', './scripts/autopilot-sdk-bump.sh'] &&
       !has(variables.container.args) && !has(variables.container.securityContext))
    message: "autopilot-sdk-bump runs scripts/autopilot-sdk-bump.sh from the auto-generate-controllers image, unprivileged, as periodic-service-account"
  - expression: >-
      request.operation != 'CREATE' || !variables.triage ||
      (object.spec.cluster == 'build' &&
       variables.pod.serviceAccountName == 'workflow-runner' &&
       variables.container.image.startsWith('${PROW_IMAGES_REPO_URI}:add-resource-') &&
       variables.container.command == ['/app/triage-job.sh'] &&
       !has(variables.container.securityContext) &&
       !has(variables.pod.volumes) && !has(variables.container.volumeMounts) &&
       !has(object.spec.extra_refs) &&
       (!has(variables.container.env) || variables.container.env.all(e, !has(e.valueFrom))) &&
       object.metadata.name.matches('-g[1-9][0-9]{0,3}-t[1-9][0-9]{0,2}$'))
    message: "agent-workflow-triage runs triage-job.sh from the add-resource image on the build cluster as workflow-runner, unprivileged, with no volume, secret or extra ref, named by a triage launch id"
  - expression: >-
      request.operation != 'CREATE' || variables.triage ||
      !object.metadata.name.matches('-t[0-9]+$')
    message: "a triage launch id names only an agent-workflow-triage job"
  - expression: >-
      request.operation != 'CREATE' || !has(variables.container.env) ||
      variables.container.env.all(e, !has(e.valueFrom) ||
        (has(e.valueFrom.secretKeyRef) && !has(e.valueFrom.configMapKeyRef) &&
         !has(e.valueFrom.fieldRef) && !has(e.valueFrom.resourceFieldRef) &&
         e.valueFrom.secretKeyRef.name == (variables.sdkBump ? 'prowjob-github-pat-token' : 'agent-github-pat-token')))
    message: "the only secret in the environment is the workflow's GitHub token"
  - expression: >-
      request.operation != 'CREATE' || !has(variables.pod.volumes) ||
      variables.pod.volumes.all(v,
        (has(v.csi) && v.csi.driver == 'secrets-store.csi.k8s.io' && has(v.csi.volumeAttributes) &&
         'secretProviderClass' in v.csi.volumeAttributes &&
         v.csi.volumeAttributes['secretProviderClass'] == (variables.sdkBump ? 'prow-secrets' : 'agent-secrets')) ||
        (variables.sdkBump && v.name == 'github-token-censor' && has(v.secret) &&
         v.secret.secretName == 'prowjob-github-pat-token') ||
        (variables.agentJob && has(v.emptyDir)) ||
        (variables.agentJob && has(v.hostPath) && v.hostPath.path in ['/lib/modules', '/sys/fs/cgroup']))
    message: "volumes: the workflow's SecretProviderClass; for sdk-bump the PAT secret the sidecar censors; for add-field and add-resource the kind-in-Docker emptyDirs and host paths"
  - expression: >-
      request.operation != 'CREATE' || !has(object.spec.extra_refs) ||
      object.spec.extra_refs.all(r, r.org in ['aws-controllers-k8s', '${TEST_INFRA_ORG}'] &&
        (r.repo in ['code-generator', 'runtime', 'ack-dev-skills', 'test-infra'] ||
         (variables.dod && 'ack-autopilot/service' in variables.labels &&
          r.repo == variables.labels['ack-autopilot/service'] + '-controller')) &&
        has(r.base_ref) && r.base_ref == 'main' && !has(r.clone_uri) &&
        !has(r.pulls) && !has(r.base_sha))
    message: "extra_refs: main of code-generator, runtime, ack-dev-skills or test-infra, and for autopilot-dod its service's controller; no pulls or pinned SHA"
  - expression: >-
      request.operation != 'CREATE' ||
      (has(object.spec.decoration_config) && has(variables.dc.gcs_configuration) &&
       variables.dc.gcs_configuration.bucket == '${PROW_LOGS_BUCKET}' &&
       has(variables.dc.utility_images) &&
       [variables.dc.utility_images.clonerefs, variables.dc.utility_images.initupload,
        variables.dc.utility_images.entrypoint, variables.dc.utility_images.sidecar].all(i,
         i.startsWith('public.ecr.aws/eks-distro-build-tooling/prow-')) &&
       !has(variables.dc.gcs_credentials_secret) && !has(variables.dc.s3_credentials_secret) &&
       !has(variables.dc.ssh_key_secrets) && !has(variables.dc.oauth_token_secret) &&
       !has(variables.dc.github_app_private_key_secret) && !has(variables.dc.cookiefile_secret) &&
       !has(variables.dc.default_service_account_name))
    message: "decoration: the Prow logs bucket, Prow's utility images, and no credential secrets"
  # --- UPDATE (abort) -----------------------------------------------------
  - expression: >-
      request.operation != 'UPDATE' ||
      (has(oldObject.metadata.labels) && 'ack-autopilot/managed-by' in oldObject.metadata.labels &&
       oldObject.metadata.labels['ack-autopilot/managed-by'] == 'autopilot-dispatcher' &&
       object.spec == oldObject.spec &&
       variables.labels == oldObject.metadata.labels &&
       (has(object.metadata.annotations) ? object.metadata.annotations : {}) ==
         (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}) &&
       object.status.state == 'aborted')
    message: "the Dispatcher may only abort its own ProwJobs"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: autopilot-dispatcher-prowjobs
  labels:
    app.kubernetes.io/part-of: ack-autopilot
spec:
  policyName: autopilot-dispatcher-prowjobs
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: prow
