{{- $prowImagesRepoUri := required "prowImagesRepoUri is required" .Values.prowImagesRepoUri }}
{{- $stackName := required "stackName is required" .Values.stackName }}
{{- $accountId := required "accountId is required" .Values.accountId }}
# The agent-plugin Deployment, Service and RBAC, emitted verbatim from the generated
# manifests with their ${TOKEN} placeholders resolved.
#
# Same shape as prow/agent-workflows: the chart sits in the generated files' own directory so
# .Files.Get can read them from git, the generator is untouched, and Terraform supplies only
# the three scalars. The full reasoning is in
# prow/agent-workflows/templates/agent-workflow-config.yaml; the differences here are:
#
#   No .helmignore is needed. This generator writes its output to
#   prow/plugins/deployments/ but reads its templates from prow/plugins/templates/, a
#   separate tree, so nothing foreign lands in this chart's templates/ directory.
#
#   The files are whole manifests rather than ConfigMap content, so they are emitted
#   directly instead of being indented under a data key. rbac.yaml is itself three
#   documents; that is why each file is preceded by its own `---`.
#
#   THIS PATH NEEDED AN RBAC DECISION. rbac.yaml carries a ClusterRole and
#   ClusterRoleBinding, and Argo CD could neither create those nor hold cluster-wide what
#   they grant, so escalation prevention would refuse them. The grant was added to
#   flux/argocd/cluster-scoped-rbac.yaml as a deliberate privilege expansion - read the
#   block there before changing anything here, and note the ordering requirement: those
#   rules must be LIVE before this Application first syncs, or the sync fails on
#   escalation with a message that points at the ClusterRole rather than at the missing
#   grantor rule.
#
# Argo CD renders this directory as Helm, not Kustomize, even though kustomization.yaml is
# still here for the stages on Flux: the Application sets source.helm, which is explicit and
# wins, and the implicit rule checks Chart.yaml before kustomization.yaml.
#
# Order follows agent-plugin/kustomization.yaml. Argo CD sorts by kind when applying, so it
# is for reviewers rather than for correctness.
{{- range $f := list "agent-plugin/deployment.yaml" "agent-plugin/rbac.yaml" "agent-plugin/service.yaml" }}
{{- $content := $.Files.Get $f }}
{{- if not $content }}
  {{- fail (printf "%s is missing or empty. It is generated by `make prow-gen`; this chart renders it and cannot substitute for it." $f) }}
{{- end }}
{{- $content = $content | replace "${PROW_IMAGES_REPO_URI}" $prowImagesRepoUri | replace "${STACK_NAME}" $stackName | replace "${ACCOUNT_ID}" $accountId }}
{{- with regexFind "\\$\\{[A-Z_]+\\}" $content }}
  {{- fail (printf "%s contains %s, which this chart does not resolve. Add a replace for it above and add the value to the Application in bootstrap/argocd-applications.tf." $f .) }}
{{- end }}
---
{{ $content | trimSuffix "\n" }}
{{- end }}
