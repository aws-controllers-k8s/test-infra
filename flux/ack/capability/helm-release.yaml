# Renders flux/ack/charts/ack-capability instead of the token-substituted manifest.
#
# Six Kustomizations dependsOn ack-capability, so this is the widest-reaching
# conversion in the migration. The Capability CR is what provides the ACK
# controllers themselves, so force: false and the retain policies in the template
# are what keep a failed upgrade from stranding every ACK resource.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-capability
  namespace: flux-system
spec:
  # SUSPENDED: this path is cut over to Argo CD (Application `ack-capability`). helm-controller stops
  # reconciling, so these objects are managed solely by Argo CD.
  #
  # Declared here rather than applied with kubectl, because the root test-infra Kustomization
  # re-applies this spec: an imperative suspend is silently reverted on the next reconcile and
  # both reconcilers end up owning the same objects.
  suspend: true
  interval: 60m
  targetNamespace: ack-system
  chart:
    spec:
      chart: ./flux/ack/charts/ack-capability
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        # Pinned: otherwise the lookup defaults to the HelmRelease's own namespace.
        namespace: flux-system
      interval: 60m
  install:
    createNamespace: false
  upgrade:
    force: false
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: ACCOUNT_ID
    targetPath: accountId
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: STACK_NAME
    targetPath: stackName
