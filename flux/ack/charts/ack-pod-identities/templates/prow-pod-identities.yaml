{{- $accountId := required "accountId is required" .Values.accountId }}
{{- $stackName := required "stackName is required" .Values.stackName }}
# Prow Pod Identity Associations - links IAM roles to service accounts.
# Uses hardcoded roleARN references. Roles are created first via the
# ack-pod-identity-roles Kustomization before this is applied.
---
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: prow-deployment-pod-identity
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  clusterName: {{ $stackName }}-cluster
  namespace: prow
  serviceAccount: prow-deployment-service-account
  roleARN: arn:aws:iam::{{ $accountId }}:role/{{ $stackName }}-prow-deployment-role
---
apiVersion: eks.services.k8s.aws/v1alpha1
