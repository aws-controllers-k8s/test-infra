# Supplied by the Argo CD Application as helm parameters, from Terraform. Left empty
# rather than defaulted so a missing value fails at render time via `required`,
# instead of silently producing a truncated name or ARN the way an
# unsubstituted postBuild token would.
accountId: ""
publishAccountId: ""
region: ""
stackName: ""
# Optional: the dedicated sandbox account whose agent-e2e-test-role the build-cluster
# agent workflow assumes for e2e. Left empty so environments that do not run
# agent e2e omit the assume/SSM grants entirely (see prow-iam-roles.yaml).
agentE2eAccountId: ""
