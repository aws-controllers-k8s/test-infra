# Prow IAM Roles - managed by ACK
{{- $accountId := required "accountId is required" .Values.accountId }}
{{- $publishAccountId := required "publishAccountId is required" .Values.publishAccountId }}
{{- $region := required "region is required" .Values.region }}
{{- $stackName := required "stackName is required" .Values.stackName }}
{{- /* Optional: the dedicated sandbox account whose agent-e2e-test-role the
       build-cluster agent workflow assumes to run e2e. Empty (the
       default) omits the e2e assume/SSM grants entirely, so environments that
       do not run agent e2e are unaffected. */ -}}
{{- $agentE2eAccountId := .Values.agentE2eAccountId | default "" }}
---
# Deployment Role - used by Prow core components (deck, hook, etc.)
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: prow-deployment-role
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  name: {{ $stackName }}-prow-deployment-role
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Service": "pods.eks.amazonaws.com"
          },
          "Action": ["sts:AssumeRole", "sts:TagSession"]
        }
      ]
    }
  inlinePolicies:
    S3Logs: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:Get*", "s3:List*", "s3:Put*", "s3:DeleteObject"],
            "Resource": [
              "arn:aws:s3:::{{ $stackName }}-prow-logs-{{ $accountId }}",
              "arn:aws:s3:::{{ $stackName }}-prow-logs-{{ $accountId }}/*"
            ]
          }
        ]
      }
    SecretsAccess: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["secretsmanager:GetSecretValue", "secretsmanager:DescribeSecret"],
            "Resource": "arn:aws:secretsmanager:{{ $region }}:{{ $accountId }}:secret:ack/prow/*"
          }
        ]
      }
---
# Postsubmit Role - used by postsubmit jobs (image builds, releases)
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: prow-postsubmit-role
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  name: {{ $stackName }}-prow-postsubmit-role
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Service": "pods.eks.amazonaws.com"
          },
          "Action": ["sts:AssumeRole", "sts:TagSession"]
        }
      ]
    }
  inlinePolicies:
    S3Logs: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:Get*", "s3:List*", "s3:Put*", "s3:DeleteObject"],
            "Resource": [
              "arn:aws:s3:::{{ $stackName }}-prow-logs-{{ $accountId }}",
              "arn:aws:s3:::{{ $stackName }}-prow-logs-{{ $accountId }}/*"
            ]
          }
        ]
      }
    ECRPublicPublish: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "ecr-public:Describe*",
              "ecr-public:Get*",
              "ecr-public:CreateRepository",
              "ecr-public:PutRepositoryCatalogData",
              "ecr-public:UploadLayerPart",
              "ecr-public:CompleteLayerUpload",
              "ecr-public:InitiateLayerUpload",
              "ecr-public:PutImage",
              "ecr-public:ListTagsForResource",
              "ecr-public:PutRegistryCatalogData",
              "ecr-public:BatchCheckLayerAvailability"
            ],
            "Resource": [
              "arn:aws:ecr-public::{{ $accountId }}:registry/*",
              "arn:aws:ecr-public::{{ $accountId }}:repository/*"
            ]
          },
          {
            "Effect": "Allow",
            "Action": ["ecr-public:GetAuthorizationToken"],
            "Resource": "*"
          },
          {
            "Effect": "Allow",
            "Action": ["sts:GetServiceBearerToken"],
            "Resource": "*"
          }
        ]
      }
    SSMAccess: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["ssm:GetParameter"],
            "Resource": "arn:aws:ssm:{{ $region }}:{{ $accountId }}:parameter/*"
          }
        ]
      }
    AssumeECRPublishRole: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["sts:AssumeRole", "sts:TagSession"],
            "Resource": "arn:aws:iam::{{ $publishAccountId }}:role/*"
          }
        ]
      }
    SecretsAccess: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["secretsmanager:GetSecretValue", "secretsmanager:DescribeSecret"],
            "Resource": "arn:aws:secretsmanager:{{ $region }}:{{ $accountId }}:secret:ack/prow/*"
          }
        ]
      }
---
# Presubmit Role - used by presubmit jobs (tests, E2E)
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: prow-presubmit-role
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  name: {{ $stackName }}-prow-presubmit-role
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Service": "pods.eks.amazonaws.com"
          },
          "Action": ["sts:AssumeRole", "sts:TagSession"]
        }
      ]
    }
  inlinePolicies:
    S3Logs: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["s3:Get*", "s3:List*", "s3:Put*", "s3:DeleteObject"],
            "Resource": [
              "arn:aws:s3:::{{ $stackName }}-prow-logs-{{ $accountId }}",
              "arn:aws:s3:::{{ $stackName }}-prow-logs-{{ $accountId }}/*"
            ]
          }
        ]
      }
    AssumeTestRoles: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["sts:AssumeRole", "sts:TagSession"],
            "Resource": [
              "arn:*:iam::*:role/*-ack-test-role-DO-NOT-DELETE",
              "arn:*:iam::*:role/ack-carm-role-DO-NOT-DELETE"
            ]
          },
          {
            "Effect": "Allow",
            "Action": ["iam:GetPolicy"],
            "Resource": "*"
          }
        ]
      }
    SSMTestRoles: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["ssm:GetParameter"],
            "Resource": [
              "arn:aws:ssm:{{ $region }}:{{ $accountId }}:parameter/ack/prow/service_team_role/*",
              "arn:aws:ssm:{{ $region }}:{{ $accountId }}:parameter/ack/prow/carm_role"
            ]
          }
        ]
      }
    ECRPublicRead: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "ecr-public:GetAuthorizationToken",
              "sts:GetServiceBearerToken",
              "ecr-public:BatchCheckLayerAvailability",
              "ecr-public:GetRepositoryPolicy",
              "ecr-public:DescribeRepositories",
              "ecr-public:DescribeRegistries",
              "ecr-public:DescribeImages",
              "ecr-public:DescribeImageTags",
              "ecr-public:GetRepositoryCatalogData",
              "ecr-public:GetRegistryCatalogData"
            ],
            "Resource": "*"
          }
        ]
      }
