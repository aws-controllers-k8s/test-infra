{{- $stackName := required "stackName is required" .Values.stackName }}
# Build cluster — created (not adopted) by the ACK EKS controller running on the
# control-plane cluster, against the AWS API in the same account.
#   - roleRef     → the cluster IAM role CR (roles.yaml)
#   - subnetRefs  → the private Subnet CRs (subnets.yaml); ACK resolves the IDs
#                   once those reconcile, so no hardcoded IDs
#
# EKS Auto Mode is the trio computeConfig / elasticLoadBalancing / blockStorage
# enabled, mirroring the control-plane cluster (bootstrap/cluster.tf).
apiVersion: eks.services.k8s.aws/v1alpha1
kind: Cluster
metadata:
  name: build-cluster
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    services.k8s.aws/deletion-policy: retain
spec:
  name: {{ $stackName }}-build-cluster
  version: "1.35"
  roleRef:
    from:
      name: build-cluster-role
  resourcesVPCConfig:
    subnetRefs:
    - from:
        name: build-subnet-private-a
    - from:
        name: build-subnet-private-b
    endpointPublicAccess: true
    endpointPrivateAccess: true
  accessConfig:
    authenticationMode: API
    bootstrapClusterCreatorAdminPermissions: false
  bootstrapSelfManagedAddons: false
  computeConfig:
    # Auto Mode enabled, but NO built-in NodePools. An empty nodePools list keeps
    # EKS from provisioning the general-purpose/system pools (and their small
    # instances that hit the ENI pod-density limit).
    #
    # The hub cluster does NOT do this — it keeps general-purpose (see
    # bootstrap/cluster.tf). So this file is the only worked example of running
    # with nodePools: [], which makes it the reference for ever taking the hub
    # the same way. What that costs is spelled out below.
    #
    # Because no built-in pool is enabled, EKS does NOT auto-provision the managed
    # `default` NodeClass or the node-role AccessEntry. Both are supplied by the
    # remote-applied build-cluster-resources Kustomization: a custom NodeClass
    # (prow-compute) + the prow-compute NodePool referencing it, plus an
    # EC2-type node AccessEntry (flux/ack/build-cluster/access-entries.yaml).
    enabled: true
    nodePools: []
  kubernetesNetworkConfig:
    elasticLoadBalancing:
      enabled: true
  storageConfig:
    blockStorage:
      enabled: true
  logging:
    clusterLogging:
    - enabled: true
      types:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
  # Everything below carries the value EKS already reports, so none of it changes the
  # cluster. It is here to stop a permanent reconcile failure.
  #
  # DescribeCluster returns these fields whether or not the CR sets them, and ACK's
  # generated delta uses HasNilDifference, so "absent in spec" vs "present in AWS" is
  # a difference on every pass. customUpdate then reaches a branch that builds its
  # UpdateClusterConfig from the DESIRED side, which is nil, so the request goes out
  # carrying nothing but the cluster name and EKS rejects it:
  #
  #   InvalidParameterException: The type for cluster update was not provided.
  #
  # That left the CR ACK.ResourceSynced=True but Ready=False from
  # 2026-09-28T16:54:48Z onward, retrying on backoff forever. late_initialize is
  # declared on these fields to adopt exactly these server defaults, but it cannot
  # run: the runtime calls updateResource before lateInitializeResource and returns
  # early on error, so the failing update blocks its own cure.
  #
  # The operative branch is updateComponentConfig -- the three kube*Config fields.
  # Measured, not guessed: running the controller's own newResourceDelta (v1.23.1,
  # the version the capability runs) against this live CR and a live DescribeCluster
  # gives five differences, and replaying customUpdate's branch order shows
  # updateComponentConfig is the first one that issues an API call. Declaring the
  # three configs takes the delta to two (tags, controlPlaneEgressMode) and leaves
  # NO branch firing, so customUpdate returns success, Sync finally reaches
  # lateInitializeResource, and controlPlaneEgressMode is adopted there.
  #
  # deletionProtection was added first, on a wrong reading of the same symptom; it
  # is a real difference and harmless to declare, but it was never the branch that
  # fired. Kept because it is correct and matches AWS.
  #
  # DO NOT ALSO DECLARE upgradePolicy OR controlPlaneScalingConfig. DescribeCluster
  # reports both (EXTENDED, standard) while the CR omits them, so they look like the
  # same bug -- but the delta probe shows DifferentAt is FALSE for both, so they are
  # not in the delta at all. Their update helpers also dereference
  # spec.upgradePolicy.supportType and spec.controlPlaneScalingConfig.tier with no
  # nil guard. Declaring them would set `desired` against a nil `latest`, creating a
  # NEW permanent delta that SUCCEEDS every reconcile -- trading a stuck error for
  # endless real UpdateClusterConfig calls against the control plane.
  #
  # Keep every value equal to what DescribeCluster reports. Matching clears the delta
  # and issues no API call; differing issues a real control-plane update. Read them
  # with an SDK new enough to know the fields -- aws-cli 2.33 omits the kube*Config
  # trio from its output model entirely, which makes them look absent when they are
  # not. The upstream fix is a customPreCompare adoption in eks-controller (the
  # pattern PR #255 uses for the Auto Mode fields), after which all of this can go.
  deletionProtection: false
  kubeAPIServerConfig:
    eventTTL: 60m
    serviceNodePortRange:
      minPort: 30000
      maxPort: 32767
  kubeSchedulerConfig:
    nodeResourcesFit:
      scoringStrategy:
        type: LeastAllocated
        resources:
        - name: cpu
          weight: 1
        - name: memory
          weight: 1
  kubeControllerManagerConfig:
    horizontalPodAutoscalerControllerConfig:
      horizontalPodAutoscalerSyncPeriod: 15s
    podGCControllerConfig:
      terminatedPodGCThreshold: 12500
