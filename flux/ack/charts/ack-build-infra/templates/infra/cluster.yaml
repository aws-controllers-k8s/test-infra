{{- $stackName := required "stackName is required" .Values.stackName }}
# Build cluster — created (not adopted) by the ACK EKS controller running on the
# control-plane cluster, against the AWS API in the same account.
#   - roleRef     → the cluster IAM role CR (roles.yaml)
#   - subnetRefs  → the private Subnet CRs (subnets.yaml); ACK resolves the IDs
#                   once those reconcile, so no hardcoded IDs
#
# EKS Auto Mode is the trio computeConfig / elasticLoadBalancing / blockStorage
# enabled, mirroring the control-plane cluster (bootstrap/cluster.tf).
apiVersion: eks.services.k8s.aws/v1alpha1
kind: Cluster
metadata:
  name: build-cluster
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    services.k8s.aws/deletion-policy: retain
spec:
  name: {{ $stackName }}-build-cluster
  version: "1.35"
  roleRef:
    from:
      name: build-cluster-role
  resourcesVPCConfig:
    subnetRefs:
    - from:
        name: build-subnet-private-a
    - from:
        name: build-subnet-private-b
    endpointPublicAccess: true
    endpointPrivateAccess: true
  accessConfig:
    authenticationMode: API
    bootstrapClusterCreatorAdminPermissions: false
  bootstrapSelfManagedAddons: false
  computeConfig:
    # Auto Mode enabled, but NO built-in NodePools. An empty nodePools list keeps
    # EKS from provisioning the general-purpose/system pools (and their small
    # instances that hit the ENI pod-density limit).
    #
    # The hub cluster does NOT do this — it keeps general-purpose (see
    # bootstrap/cluster.tf). So this file is the only worked example of running
    # with nodePools: [], which makes it the reference for ever taking the hub
    # the same way. What that costs is spelled out below.
    #
    # Because no built-in pool is enabled, EKS does NOT auto-provision the managed
    # `default` NodeClass or the node-role AccessEntry. Both are supplied by the
    # remote-applied build-cluster-resources Kustomization: a custom NodeClass
    # (prow-compute) + the prow-compute NodePool referencing it, plus an
    # EC2-type node AccessEntry (flux/ack/build-cluster/access-entries.yaml).
    enabled: true
    nodePools: []
  kubernetesNetworkConfig:
    elasticLoadBalancing:
      enabled: true
  storageConfig:
    blockStorage:
      enabled: true
  logging:
    clusterLogging:
    - enabled: true
      types:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
  # Carries the value EKS already reports, so it changes nothing about the cluster.
  # It is here to stop a permanent reconcile failure.
  #
  # DescribeCluster returns deletionProtection whether or not the CR sets it, and
  # ACK's generated delta uses HasNilDifference, so "absent in spec" vs "false in
  # AWS" is a difference on every pass. customUpdate reaches its deletionProtection
  # branch and builds UpdateClusterConfig from the DESIRED side, which is nil.
  # A nil pointer is simply omitted, so the request goes out carrying nothing but
  # the cluster name and EKS rejects it:
  #
  #   InvalidParameterException: The type for cluster update was not provided.
  #
  # That left the CR ACK.ResourceSynced=True but Ready=False from
  # 2026-09-28T16:54:48Z onward. The late_initialize directive on this field exists
  # to adopt exactly that server default, but it cannot run: the runtime calls
  # updateResource before lateInitializeResource and returns early on error, so the
  # failing update blocks its own cure.
  #
  # DO NOT ALSO DECLARE upgradePolicy OR controlPlaneScalingConfig. DescribeCluster
  # reports both (EXTENDED, standard) while the CR omits them, so they look like the
  # same bug -- but they are not in the delta. Their update helpers dereference
  # spec.upgradePolicy.supportType and spec.controlPlaneScalingConfig.tier with no
  # nil guard, so a nil desired side would crash the controller rather than produce
  # the error above. eks-controller v1.23.1 is what runs here, and it is not
  # crashing, which is how we know those branches are never reached. Declaring them
  # would make `latest` nil and `desired` set, creating a NEW permanent delta that
  # SUCCEEDS every reconcile -- trading a stuck error for endless real
  # UpdateClusterConfig calls against the control plane.
  #
  # Keep the value equal to what `aws eks describe-cluster` reports. Matching clears
  # the delta and issues no API call; differing issues a real control-plane update.
  deletionProtection: false
