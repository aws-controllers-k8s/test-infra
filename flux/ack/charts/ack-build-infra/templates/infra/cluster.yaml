{{- $stackName := required "stackName is required" .Values.stackName }}
# Build cluster — created (not adopted) by the ACK EKS controller running on the
# control-plane cluster, against the AWS API in the same account.
#   - roleRef     → the cluster IAM role CR (roles.yaml)
#   - subnetRefs  → the private Subnet CRs (subnets.yaml); ACK resolves the IDs
#                   once those reconcile, so no hardcoded IDs
#
# EKS Auto Mode is the trio computeConfig / elasticLoadBalancing / blockStorage
# enabled, mirroring the control-plane cluster (bootstrap/cluster.tf).
apiVersion: eks.services.k8s.aws/v1alpha1
kind: Cluster
metadata:
  name: build-cluster
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    services.k8s.aws/deletion-policy: retain
spec:
  name: {{ $stackName }}-build-cluster
  version: "1.35"
  roleRef:
    from:
      name: build-cluster-role
  resourcesVPCConfig:
    subnetRefs:
    - from:
        name: build-subnet-private-a
    - from:
        name: build-subnet-private-b
    endpointPublicAccess: true
    endpointPrivateAccess: true
  accessConfig:
    authenticationMode: API
    bootstrapClusterCreatorAdminPermissions: false
  bootstrapSelfManagedAddons: false
  computeConfig:
    # Auto Mode enabled, but NO built-in NodePools. An empty nodePools list keeps
    # EKS from provisioning the general-purpose/system pools (and their small
    # instances that hit the ENI pod-density limit).
    #
    # The hub cluster does NOT do this — it keeps general-purpose (see
    # bootstrap/cluster.tf). So this file is the only worked example of running
    # with nodePools: [], which makes it the reference for ever taking the hub
    # the same way. What that costs is spelled out below.
    #
    # Because no built-in pool is enabled, EKS does NOT auto-provision the managed
    # `default` NodeClass or the node-role AccessEntry. Both are supplied by the
    # remote-applied build-cluster-resources Kustomization: a custom NodeClass
    # (prow-compute) + the prow-compute NodePool referencing it, plus an
    # EC2-type node AccessEntry (flux/ack/build-cluster/access-entries.yaml).
    enabled: true
    nodePools: []
  kubernetesNetworkConfig:
    elasticLoadBalancing:
      enabled: true
  storageConfig:
    blockStorage:
      enabled: true
  logging:
    clusterLogging:
    - enabled: true
      types:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
  # Fields below carry the value EKS already reports for this cluster. They are
  # declared not to change anything but to stop a permanent reconcile failure.
  #
  # DescribeCluster returns these three whether or not the CR sets them. ACK's
  # generated delta uses HasNilDifference, so "absent in spec" vs "present in
  # AWS" is a difference forever. customUpdate then picks the matching branch and
  # builds its UpdateClusterConfig from the DESIRED side, which is nil, so the
  # request goes out carrying only the cluster name and EKS rejects it:
  #
  #   InvalidParameterException: The type for cluster update was not provided.
  #
  # That leaves the CR ACK.ResourceSynced=True but Ready=False, and it retries
  # every ~17 minutes indefinitely (first seen 2026-09-28T16:54:48Z). The
  # late_initialize directives in the controller's generator.yaml exist to adopt
  # exactly these server defaults, but they cannot run here: the runtime calls
  # updateResource before lateInitializeResource and returns early on error, so
  # the failing update blocks its own cure.
  #
  # Keep each value equal to what `aws eks describe-cluster` reports. A value
  # that MATCHES clears the delta and issues no API call; a value that DIFFERS
  # issues a real control-plane update.
  deletionProtection: false
  controlPlaneScalingConfig:
    tier: standard
  # Records the support type EKS has already applied, so this is a no-op today.
  # It is still a policy pin: once the cluster runs a Kubernetes version inside
  # the standard support window, this line keeps asserting EXTENDED rather than
  # following EKS back to STANDARD. Revisit it on cluster version upgrades.
  upgradePolicy:
    supportType: EXTENDED
