{{- $stackName := required "stackName is required" .Values.stackName }}
# Build cluster subnets — created by ACK EC2 controller.
#
# CIDR layout mirrors bootstrap/cluster.tf's cidrsubnet(cidr, 4, i) scheme on a
# /16: two private /20s (indices 0,1) and two public /20s (indices 4,5), across
# us-west-2a and us-west-2b.
#
# Route-table association is owned by the Subnet (routeTableRefs), not the
# RouteTable. Kubernetes discovery tags let the EKS load balancer controller
# place internal/external LBs: internal-elb on private, elb on public.
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: Subnet
metadata:
  name: build-subnet-private-a
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  cidrBlock: "10.1.0.0/20"
  availabilityZone: us-west-2a
  vpcRef:
    from:
      name: build-vpc
  routeTableRefs:
  - from:
      name: build-rt-private
  tags:
  - key: Name
    value: {{ $stackName }}-build-private-us-west-2a
  - key: kubernetes.io/role/internal-elb
    value: "1"
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: Subnet
metadata:
  name: build-subnet-private-b
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  cidrBlock: "10.1.16.0/20"
  availabilityZone: us-west-2b
  vpcRef:
    from:
      name: build-vpc
  routeTableRefs:
  - from:
      name: build-rt-private
  tags:
  - key: Name
    value: {{ $stackName }}-build-private-us-west-2b
  - key: kubernetes.io/role/internal-elb
    value: "1"
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: Subnet
metadata:
  name: build-subnet-public-a
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  cidrBlock: "10.1.64.0/20"
  availabilityZone: us-west-2a
  mapPublicIPOnLaunch: true
  vpcRef:
    from:
      name: build-vpc
  routeTableRefs:
  - from:
      name: build-rt-public
  tags:
  - key: Name
    value: {{ $stackName }}-build-public-us-west-2a
  - key: kubernetes.io/role/elb
    value: "1"
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: Subnet
metadata:
  name: build-subnet-public-b
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  cidrBlock: "10.1.80.0/20"
  availabilityZone: us-west-2b
  mapPublicIPOnLaunch: true
  vpcRef:
    from:
      name: build-vpc
  routeTableRefs:
  - from:
      name: build-rt-public
  tags:
  - key: Name
    value: {{ $stackName }}-build-public-us-west-2b
  - key: kubernetes.io/role/elb
    value: "1"
