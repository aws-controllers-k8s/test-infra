{{- $accountId := required "accountId is required" .Values.accountId }}
{{- $stackName := required "stackName is required" .Values.stackName }}
# Build cluster EKS Access Entries, reconciled by the control-plane ACK EKS
# controller. They grant Kubernetes API access to the build cluster: a
# break-glass admin role, the account's Admin/ReadOnly roles for humans, the
# Prow components' role, the Flux kustomize-controller role, and the EC2 node
# role (Auto Mode nodes — required because we run a custom NodeClass with no
# built-in pools, so EKS doesn't auto-create the node entry).
#
# The Flux entry uses an access policy rather than a kubernetesGroups mapping so
# its authorization exists on the first reconcile — otherwise the RBAC authorizing
# Flux would itself be an object Flux must apply. Mirrors kustomize-controller on
# the control plane.
---
# Dedicated build-cluster admin role (assumable by account root for break-glass)
apiVersion: eks.services.k8s.aws/v1alpha1
kind: AccessEntry
metadata:
  name: build-cluster-admin-access
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    services.k8s.aws/deletion-policy: retain
spec:
  clusterRef:
    from:
      name: build-cluster
  principalARN: "arn:aws:iam::{{ $accountId }}:role/{{ $stackName }}-build-cluster-admin-access-role"
  type: STANDARD
  accessPolicies:
  - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
    accessScope:
      type: cluster
---
# Admin role — cluster admin access for humans (mirrors control-plane).
apiVersion: eks.services.k8s.aws/v1alpha1
kind: AccessEntry
metadata:
  name: build-admin-access
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    services.k8s.aws/deletion-policy: retain
spec:
  clusterRef:
    from:
      name: build-cluster
  principalARN: "arn:aws:iam::{{ $accountId }}:role/Admin"
  type: STANDARD
  accessPolicies:
  - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
    accessScope:
      type: cluster
---
# ReadOnly role — view-only access for humans (mirrors control-plane).
apiVersion: eks.services.k8s.aws/v1alpha1
kind: AccessEntry
metadata:
  name: build-readonly-access
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    services.k8s.aws/deletion-policy: retain
spec:
  clusterRef:
    from:
      name: build-cluster
  principalARN: "arn:aws:iam::{{ $accountId }}:role/ReadOnly"
  type: STANDARD
  accessPolicies:
  - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSAdminViewPolicy
    accessScope:
      type: cluster
---
# Prow components' identity — reaches the build cluster API to schedule/clean/
# report on test pods. Mapped to the `prow-build-cluster` group, which the
# remote-applied RBAC (flux/prow/build-cluster-resources) binds in test-pods.
apiVersion: eks.services.k8s.aws/v1alpha1
kind: AccessEntry
metadata:
  name: prow-deployment-build-access
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    services.k8s.aws/deletion-policy: retain
spec:
  clusterRef:
    from:
      name: build-cluster
  principalARN: "arn:aws:iam::{{ $accountId }}:role/{{ $stackName }}-prow-deployment-role"
  type: STANDARD
  kubernetesGroups:
  - prow-build-cluster
---
# Flux kustomize-controller identity — remote-applies the in-cluster objects
# ACK cannot create. Cluster-admin via access policy (see header note). Backed
# by flux-build-cluster-role + flux-pod-identity.yaml.
apiVersion: eks.services.k8s.aws/v1alpha1
kind: AccessEntry
metadata:
  name: flux-build-cluster-access
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    services.k8s.aws/deletion-policy: retain
spec:
  clusterRef:
    from:
      name: build-cluster
  principalARN: "arn:aws:iam::{{ $accountId }}:role/{{ $stackName }}-flux-build-cluster-role"
  type: STANDARD
  accessPolicies:
  - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
    accessScope:
      type: cluster
---
# Node role — lets EKS Auto Mode nodes join the cluster. EKS auto-creates this
# entry only for built-in node pools; because the build cluster runs a custom
# NodeClass with no built-in pools (infra/cluster.yaml computeConfig.nodePools:
# []), we must supply it. Type EC2 + AmazonEKSAutoNodePolicy is the required
# combination for Auto Mode node roles (custom NodeClass docs: create-node-class).
#
# adopt-or-create: a fresh Design-B cluster never ran a built-in pool, so EKS
# never made this entry → ACK creates it. But a cluster that previously ran
# general-purpose (e.g. before the switch to nodePools: []) already has an
# EKS-created EC2 entry for this same principal → ACK adopts it instead of
# failing terminal on "resource already exists".
#
# No adoption-fields annotation needed: adopt-or-create reads the find/create
# identifiers (principalARN + the clusterRef-resolved clusterName) from the spec.
# adoption-fields is only required when a lookup field lives in status.
apiVersion: eks.services.k8s.aws/v1alpha1
kind: AccessEntry
metadata:
  name: build-node-access
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    services.k8s.aws/deletion-policy: retain
    services.k8s.aws/adoption-policy: adopt-or-create
spec:
  clusterRef:
    from:
      name: build-cluster
  principalARN: "arn:aws:iam::{{ $accountId }}:role/{{ $stackName }}-build-node-role"
  type: EC2
  accessPolicies:
  - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSAutoNodePolicy
    accessScope:
      type: cluster
---
# Argo CD capability role — the successor to the Flux entry above.
#
# prow-build-cluster-resources applies thirteen in-cluster objects INTO this cluster: a
# Namespace, a ServiceAccount, four Roles and four RoleBindings, the test-config
# ConfigMap, a NodeClass and a NodePool. ACK cannot own those - they are Kubernetes
# objects in a remote cluster, not AWS resources - so something must remote-apply them,
# and after Flux that is Argo CD. This entry is what makes the build cluster registerable
# as an Argo CD destination at all; without it, registering the spoke would produce a
# cluster Argo CD cannot authenticate to, which is worse than not registering it.
#
# WHY ClusterAdminPolicy, when the hub deliberately avoids it.
#
# On the hub, cluster-scoped access is granted by adding a kubernetesGroups entry to the
# access entry and binding a narrow ClusterRole (flux/argocd/cluster-scoped-rbac.yaml),
# specifically to avoid handing Argo CD cluster-admin. That approach cannot work here.
# The ClusterRole would have to live inside THIS cluster, and once Flux is gone the only
# thing able to apply it is Argo CD - the very thing it authorises. On the hub that
# circularity is escaped because Flux owns flux/argocd/ until Phase 5 decides otherwise;
# on a remote cluster there is no such applier. The narrow role would also have to
# enumerate every permission in those four Roles, or Kubernetes escalation prevention
# refuses them: a principal may not create a Role granting permissions it lacks.
#
# This is also not an increase in privilege. It is the same grant
# flux-build-cluster-access already holds, and that entry is removed with Flux in Phase 5,
# so the number of cluster-admin principals on this cluster stays at one. The build
# cluster is a CI execution environment rather than the control plane, which is why the
# trade lands differently here than on the hub.
#
# Like the Flux entry, this uses an access policy rather than a kubernetesGroups mapping
# so the authorization exists on the first reconcile.
#
# If prow-build-cluster-resources is ever retired, or the build cluster stops carrying
# in-cluster objects, this entry should go with it.
apiVersion: eks.services.k8s.aws/v1alpha1
kind: AccessEntry
metadata:
  name: argocd-build-cluster-access
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    services.k8s.aws/deletion-policy: retain
spec:
  clusterRef:
    from:
      name: build-cluster
  principalARN: "arn:aws:iam::{{ $accountId }}:role/{{ $stackName }}-argocd-capability-role"
  type: STANDARD
  accessPolicies:
  - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
    accessScope:
      type: cluster
