{{- $stackName := required "stackName is required" .Values.stackName }}
# Flux Pod Identity for build-cluster remote-apply.
#
# Binds the control-plane Flux kustomize-controller to the build-cluster IAM
# role (roles/flux-build-cluster-role.yaml) so Flux can call eks:DescribeCluster
# and reach the build cluster with workload identity — the remote Kustomization
# uses kubeConfig.configMapRef (provider: aws) rather than a static secret,
# since distroless Flux controllers can't run an exec-plugin kubeconfig.
#
# NOTE: this association targets the CONTROL-PLANE cluster (where Flux runs),
# not the build cluster. clusterName is a literal (not clusterRef) because the
# control-plane Cluster CR has a minimal adopt-or-create spec that never reports
# ResourceSynced=True, which a clusterRef requires to resolve — matching the
# other control-plane PodIdentityAssociations (flux/ack/cluster/pod-identities/).
# It lives here because its only purpose is reaching the build cluster.
---
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: flux-build-cluster-pod-identity
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  clusterName: {{ $stackName }}-cluster
  namespace: flux-system
  serviceAccount: kustomize-controller
  roleRef:
    from:
      name: flux-build-cluster-role
