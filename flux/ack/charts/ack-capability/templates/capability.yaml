{{- $accountId := required "accountId is required" .Values.accountId }}
{{- $stackName := required "stackName is required" .Values.stackName }}
# ACK EKS Capability - the managed EKS capability that runs the ACK controllers
# reconciling every *.services.k8s.aws resource in this repo.
#
# deletePropagationPolicy RETAIN and deletion-policy retain both matter here: the
# capability is what provides the controllers, so tearing it down would strand
# every ACK resource on the cluster with no reconciler.
apiVersion: eks.services.k8s.aws/v1alpha1
kind: Capability
metadata:
  name: ack-eks-capability
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/adoption-fields: '{"name": "ack-eks", "clusterName": "{{ $stackName }}-cluster"}'
    services.k8s.aws/deletion-policy: retain
spec:
  clusterName: {{ $stackName }}-cluster
  name: ack-eks
  type: ACK
  deletePropagationPolicy: RETAIN
  roleARN: "arn:aws:iam::{{ $accountId }}:role/{{ $stackName }}-ack-capability-role"
