# EKS Addons managed by ACK.
#
# namespace is omitted throughout so the release namespace
# (HelmRelease.spec.targetNamespace) places the objects. The chart owns no
# Namespace.
{{- $stackName := required "stackName is required" .Values.stackName }}
{{- $accountId := required "accountId is required" .Values.accountId }}
---
apiVersion: eks.services.k8s.aws/v1alpha1
kind: Addon
metadata:
  name: secrets-store-csi
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
    # spec.addonVersion is set by the addon-version-updater periodic, not git. Do not add
    # it here: Argo CD would reassert a pinned value and the job would stop updating it.
    addon-version-updater.ack.aws.dev/owner: addon-version-updater
spec:
  clusterName: {{ $stackName }}-cluster
  name: aws-secrets-store-csi-driver-provider
  configurationValues: |-
    {
      "secrets-store-csi-driver": {
        "syncSecret": {
          "enabled": true
        }
      }
    }
---
apiVersion: eks.services.k8s.aws/v1alpha1
kind: Addon
metadata:
  name: external-dns-addon
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  clusterName: {{ $stackName }}-cluster
  name: external-dns
  podIdentityAssociations:
  - roleARN: arn:aws:iam::{{ $accountId }}:role/{{ $stackName }}-external-dns-role
    serviceAccount: external-dns
---
apiVersion: eks.services.k8s.aws/v1alpha1
kind: Addon
metadata:
  name: coredns
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  clusterName: {{ $stackName }}-cluster
  name: coredns
