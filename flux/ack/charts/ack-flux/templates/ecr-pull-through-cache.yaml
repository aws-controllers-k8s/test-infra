# ECR Pull-Through Cache for Flux images from ghcr.io.
#
# namespace is deliberately omitted so the release namespace
# (HelmRelease.spec.targetNamespace) places the object. The chart never owns a
# Namespace object.
apiVersion: ecr.services.k8s.aws/v1alpha1
kind: PullThroughCacheRule
metadata:
  name: ghcr-fluxcd
  annotations:
    # Both deletion guards, carried over from the raw manifest. Flux's prune
    # skips objects annotated prune: disabled; Helm's resource-policy: keep
    # stops Helm deleting the object on uninstall or rollback.
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  ecrRepositoryPrefix: fluxcd
  upstreamRegistryURL: ghcr.io
  upstreamRegistry: github-container-registry
  credentialARN: {{ required "ghcrPtcSecretArn is required" .Values.ghcrPtcSecretArn | quote }}
