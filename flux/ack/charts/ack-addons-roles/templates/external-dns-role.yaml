# IAM Role for external-dns - allows managing Route53 records.
#
# namespace is omitted so the release namespace
# (HelmRelease.spec.targetNamespace) places the object. The chart owns no
# Namespace.
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: external-dns-role
  annotations:
    # Both deletion guards, carried over from the raw manifest.
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  name: {{ required "stackName is required" .Values.stackName }}-external-dns-role
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Service": "pods.eks.amazonaws.com"
          },
          "Action": ["sts:AssumeRole", "sts:TagSession"]
        }
      ]
    }
  inlinePolicies:
    Route53Records: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "route53:ChangeResourceRecordSets"
            ],
            "Resource": "arn:aws:route53:::hostedzone/*"
          },
          {
            "Effect": "Allow",
            "Action": [
              "route53:ListHostedZones",
              "route53:ListResourceRecordSets",
              "route53:ListTagsForResource"
            ],
            "Resource": "*"
          }
        ]
      }
