apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The hub EKS cluster is managed by Terraform (bootstrap/cluster.tf,
# aws_eks_cluster.this), so no Cluster CR is declared here or in the chart.
#
# addons/ and pod-identities/ are deliberately not included: each is owned by its
# own Kustomization (ack-addons, ack-pod-identities), and including them here
# would render those paths a second time under this Kustomization.
resources:
- helm-release.yaml
