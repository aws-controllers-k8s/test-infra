apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- helm-release.yaml
# roles/ is deliberately NOT included here. It is owned by the ack-addons-roles
# Kustomization, and ack-addons dependsOn ack-addons-roles, so the role is
# applied first either way. Including it here made ack-addons render the same
# path a second time, and because ack-addons set targetNamespace: ack-system
# that second copy of the HelmRelease was rewritten into ack-system, where
# valuesFrom cannot resolve self-managed-vars (valuesFrom has no namespace field
# and always reads the HelmRelease's own namespace).
