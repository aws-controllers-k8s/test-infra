# Renders flux/ack/charts/ack-addons-roles instead of the token-substituted
# manifest. The HelmRelease stays inside the existing Kustomization so the
# dependsOn edge on ack-capability (a Kustomization) is preserved.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-addons-roles
  namespace: flux-system
spec:
  # SUSPENDED: this path is cut over to Argo CD (Application `ack-addons-roles`). helm-controller stops
  # reconciling, so these objects are managed solely by Argo CD.
  #
  # Declared here rather than applied with kubectl, because the root test-infra Kustomization
  # re-applies this spec: an imperative suspend is silently reverted on the next reconcile and
  # both reconcilers end up owning the same objects.
  suspend: true
  interval: 60m
  targetNamespace: ack-system
  chart:
    spec:
      chart: ./flux/ack/charts/ack-addons-roles
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        namespace: flux-system
      interval: 60m
  install:
    createNamespace: false
  upgrade:
    # force would delete and recreate the IAM role behind the CR.
    force: false
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: STACK_NAME
    targetPath: stackName
