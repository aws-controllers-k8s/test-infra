# Renders flux/ack/charts/ack-flux instead of the token-substituted manifest.
#
# The HelmRelease sits inside the existing ack-flux Kustomization rather than
# replacing it: HelmRelease.spec.dependsOn can only reference other
# HelmReleases, and ack-flux dependsOn ack-capability, which is a Kustomization.
# Keeping the Kustomization as the ordering primitive preserves the dependency
# graph unchanged.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-flux
  namespace: flux-system
spec:
  # SUSPENDED: this path is cut over to Argo CD (Application `ack-flux`). helm-controller stops
  # reconciling, so these objects are managed solely by Argo CD.
  #
  # Declared here rather than applied with kubectl, because the root test-infra Kustomization
  # re-applies this spec: an imperative suspend is silently reverted on the next reconcile and
  # both reconcilers end up owning the same objects.
  suspend: true
  interval: 60m
  targetNamespace: ack-system
  chart:
    spec:
      chart: ./flux/ack/charts/ack-flux
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        # Pinned: without it the lookup defaults to the HelmRelease's own
        # namespace, which breaks if this object is ever relocated.
        namespace: flux-system
      interval: 60m
  install:
    # The namespace is owned by ack-pod-identities, never by a chart.
    createNamespace: false
  upgrade:
    # Never force-replace. force does a delete+recreate, which for an ACK
    # resource means destroying the AWS resource behind it.
    force: false
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: GHCR_PTC_SECRET_ARN
    targetPath: ghcrPtcSecretArn
