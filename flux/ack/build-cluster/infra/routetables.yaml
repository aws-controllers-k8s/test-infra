# Build cluster route tables — created by ACK EC2 controller.
#
# Public RT routes 0.0.0.0/0 to the Internet Gateway; private RT routes
# 0.0.0.0/0 to the NAT Gateway. Subnets attach to these via their own
# routeTableRefs (subnets.yaml) — the association is owned by the Subnet, not
# the RouteTable. The local (in-VPC) route is implicit and managed by AWS.
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: RouteTable
metadata:
  name: build-rt-public
  namespace: ack-system
spec:
  vpcRef:
    from:
      name: build-vpc
  routes:
  - destinationCIDRBlock: "0.0.0.0/0"
    gatewayRef:
      from:
        name: build-igw
  tags:
  - key: Name
    value: ${STACK_NAME}-build-rt-public
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: RouteTable
metadata:
  name: build-rt-private
  namespace: ack-system
spec:
  vpcRef:
    from:
      name: build-vpc
  routes:
  - destinationCIDRBlock: "0.0.0.0/0"
    natGatewayRef:
      from:
        name: build-natgw
  tags:
  - key: Name
    value: ${STACK_NAME}-build-rt-private
