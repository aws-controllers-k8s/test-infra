# Prow deployment - dependency chain:
# 1. prow-version: ConfigMap with PROW_VERSION (must exist before substitution)
# 2. prow-crds: CRDs must exist before anything else
# 3. prow-mirror: Copies official Prow images from us-docker.pkg.dev into ECR
# 4. prow-charts: Prow components that depend on images from step 3
#
# Build cluster:
# - prow-build-cluster-kubeconfig: applies the aws-provider kubeconfig ConfigMap
#   LOCALLY (flux-system) so kustomize-controller can reach the build cluster.
# - prow-build-cluster-resources: REMOTE-applies the in-cluster objects (namespace,
#   SA, RBAC, NodeClass, NodePool) to the build cluster via kubeConfig.configMapRef
#   (the only Kustomization here that targets a remote cluster). Depends on the
#   ConfigMap + the ACK resources that grant Flux its identity/access (ack-build-infra).
# - prow-build-cluster-connection: Job that reads the build cluster's endpoint +
#   CA from the ACK Cluster CR status into the build-cluster-connection ConfigMap,
#   which prow-charts substitutes into the components' build-cluster kubeconfig.

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-version
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/version
  # prune: false, the last three paths to lose it. Phase 5 DELETES this Kustomization, and a
  # Kustomization with prune enabled garbage-collects its inventory when it is deleted - here
  # that is the prow-version ConfigMap. The chart defaults that replaced it are git-authored,
  # so losing the ConfigMap is survivable, but it should be an explicit `kubectl delete` and
  # not a side effect of removing a file.
  prune: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-crds
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/crds
  # prune deliberately disabled for the Argo CD migration: this path is converted or
  # deleted later in the sequence, and prune deletes objects that a conversion makes
  # stale. Deleting a Kustomization with prune enabled also garbage-collects its
  # inventory, so this must be false before any later stage removes it.
  prune: false
  dependsOn:
  - name: ack-pod-identities
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-mirror
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/mirror
  prune: false
  force: true
  # Wait for the Job to COMPLETE, not just apply. prow-charts depends on this
  # Kustomization and pins the -ack.<revision> tags this Job produces, so
  # without wait the components roll out before the tags exist and land in
  # ImagePullBackOff. A serial buildah pull/upgrade/commit/push across 15 images
  # on vfs storage takes minutes rather than the seconds `crane copy` took, so
  # the timeout is deliberately generous.
  wait: true
  timeout: 30m
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
    - kind: ConfigMap
      name: prow-version
  dependsOn:
  - name: prow-version
  - name: ack-pod-identities
  - name: ack-prow
---
# Job that writes the build cluster's endpoint + CA (from the ACK Cluster CR
# status) into the build-cluster-connection ConfigMap. prune:false + force:true
# because the Job is immutable and must re-run each reconcile (like prow-mirror).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-build-cluster-connection
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/build-cluster-connection
  prune: false
  force: true
  # wait for the Job to COMPLETE (not just apply), so prow-charts' dependsOn
  # blocks until the ConfigMap it substitutes from actually exists.
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
  dependsOn:
  - name: ack-build-infra
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-charts
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/charts
  # prune: false, and on this path it is the difference between a clean Flux removal and an
  # outage. Its inventory holds the prow-config and prow-data-plane HelmReleases, and
  # prow-config's release owns Prow's nine Deployments. Deleting this Kustomization while
  # prune is enabled would garbage-collect those HelmReleases, and whether helm-controller
  # then UNINSTALLS the releases - taking the Deployments with them - depends on how it treats
  # a suspended release on deletion. With prune off the question never arises.
  prune: false
  targetNamespace: flux-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
    - kind: ConfigMap
      name: prow-version
    # Build cluster endpoint + CA, written by prow-build-cluster-connection.
    # Optional so prow-charts still reconciles while buildCluster.enabled is
    # false (the ConfigMap is only consumed by the gated build-cluster kubeconfig).
    - kind: ConfigMap
      name: build-cluster-connection
      optional: true
  dependsOn:
  - name: prow-mirror
  - name: prow-build-cluster-connection
---
# Build cluster kubeconfig ConfigMap — applied LOCALLY to flux-system on the
# control-plane cluster. Substitutes the cluster ARN into the aws-provider
# kubeconfig kustomize-controller uses to reach the build cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-build-cluster-kubeconfig
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/build-cluster-kubeconfig
  # prune disabled ahead of the chart conversion: converting this path makes the
  # raw object stale, and prune deletes stale objects. Must be live before the
  # content change (D19-P1).
  prune: false
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
---
# Build cluster in-cluster objects (namespace / SA / RBAC / NodeClass / NodePool)
# — REMOTE-applied via kubeConfig.configMapRef (aws workload identity); the only
# Kustomization here targeting a remote cluster. Depends on the local kubeconfig
# ConfigMap and on ack-build-infra (the Flux IAM role/PodIdentity/AccessEntry that
# authorize it).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-build-cluster-resources
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/build-cluster-resources
  # prune disabled ahead of the chart conversion: converting this path makes the
  # raw object stale, and prune deletes stale objects. Must be live before the
  # content change (D19-P1).
  prune: false
  kubeConfig:
    configMapRef:
      name: build-cluster-flux-kubeconfig
  # The NodeClass references the node role by its ${STACK_NAME}-prefixed name and
  # the cluster security group by the ${STACK_NAME}-build-cluster tag; substitute
  # them the same way the other Kustomizations do. Only the NodeClass uses vars —
  # the RBAC/namespace manifests contain no unescaped $ tokens.
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
  dependsOn:
  - name: prow-build-cluster-kubeconfig
  - name: ack-build-infra
