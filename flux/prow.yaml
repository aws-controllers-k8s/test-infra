# Prow deployment - dependency chain:
# 1. prow-version: ConfigMap with PROW_VERSION (must exist before substitution)
# 2. prow-crds: CRDs must exist before anything else
# 3. prow-mirror: Copies official Prow images from us-docker.pkg.dev into ECR
# 4. prow-charts: Prow components that depend on images from step 3
#
# Build cluster:
# - prow-build-cluster-kubeconfig: applies the aws-provider kubeconfig ConfigMap
#   LOCALLY (flux-system) so kustomize-controller can reach the build cluster.
# - prow-build-cluster-rbac: REMOTE-applies namespace/SA/RBAC to the build
#   cluster via kubeConfig.configMapRef (the only Kustomization here that targets
#   a remote cluster). Depends on the ConfigMap + the ACK resources that grant
#   Flux its identity/access (ack-build-infra).
# - prow-build-cluster-connection: Job that reads the build cluster's endpoint +
#   CA from the ACK Cluster CR status into the build-cluster-connection ConfigMap,
#   which prow-charts substitutes into the components' build-cluster kubeconfig.

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-version
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/version
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-crds
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/crds
  prune: true
  dependsOn:
  - name: ack-pod-identities
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-mirror
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/mirror
  prune: false
  force: true
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
    - kind: ConfigMap
      name: prow-version
  dependsOn:
  - name: prow-version
  - name: ack-pod-identities
  - name: ack-prow
---
# Job that writes the build cluster's endpoint + CA (from the ACK Cluster CR
# status) into the build-cluster-connection ConfigMap. prune:false + force:true
# because the Job is immutable and must re-run each reconcile (like prow-mirror).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-build-cluster-connection
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/build-cluster-connection
  prune: false
  force: true
  # wait for the Job to COMPLETE (not just apply), so prow-charts' dependsOn
  # blocks until the ConfigMap it substitutes from actually exists.
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
  dependsOn:
  - name: ack-build-infra
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-charts
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/charts
  prune: true
  targetNamespace: flux-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
    - kind: ConfigMap
      name: prow-version
    # Build cluster endpoint + CA, written by prow-build-cluster-connection.
    # Optional so prow-charts still reconciles while buildCluster.enabled is
    # false (the ConfigMap is only consumed by the gated build-cluster kubeconfig).
    - kind: ConfigMap
      name: build-cluster-connection
      optional: true
  dependsOn:
  - name: prow-mirror
  - name: prow-build-cluster-connection
---
# Build cluster kubeconfig ConfigMap — applied LOCALLY to flux-system on the
# control-plane cluster. Substitutes the cluster ARN into the aws-provider
# kubeconfig kustomize-controller uses to reach the build cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-build-cluster-kubeconfig
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/build-cluster-kubeconfig
  prune: true
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
---
# Build cluster in-cluster objects (namespace / SA / RBAC) — REMOTE-applied via
# kubeConfig.configMapRef (aws workload identity); the only Kustomization here
# targeting a remote cluster. Depends on the local kubeconfig ConfigMap and on
# ack-build-infra (the Flux IAM role/PodIdentity/AccessEntry that authorize it).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-build-cluster-rbac
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prow/build-cluster-rbac
  prune: true
  kubeConfig:
    configMapRef:
      name: build-cluster-flux-kubeconfig
  dependsOn:
  - name: prow-build-cluster-kubeconfig
  - name: ack-build-infra
