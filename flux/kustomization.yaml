apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- flux.yaml
- ack.yaml
- ack-build-cluster.yaml
- secrets.yaml
- prow.yaml
# prometheus.yaml was here, declaring the prometheus and prometheus-dashboards
# Kustomizations. kube-prometheus-stack and the Prow Grafana dashboards are removed
# outright rather than migrated - nothing in Argo CD replaces them.
#
# Removing the declaration deletes nothing: both Kustomizations carried prune: false,
# so the live objects survive and have to be collected by hand. That is the prometheus
# namespace, the ten monitoring.coreos.com CRDs, and the admission Secret a chart hook
# wrote. See the manual-steps table in docs/argocd-migration-runbook.md.
#
# argocd.yaml was here, declaring the argocd-rbac Kustomization for ./flux/argocd.
# That directory exists in no commit, so it could never reconcile. The grant it
# described is Terraform's now: bootstrap/argocd-rbac.tf owns ClusterRole and
# ClusterRoleBinding argocd-cluster-scoped.
