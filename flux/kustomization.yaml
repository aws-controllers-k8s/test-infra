apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- flux.yaml
- ack.yaml
- ack-build-cluster.yaml
- secrets.yaml
- prow.yaml
- prometheus.yaml
# argocd.yaml was here, declaring the argocd-rbac Kustomization for ./flux/argocd.
# That directory exists in no commit, so it could never reconcile. The grant it
# described is Terraform's now: bootstrap/argocd-rbac.tf owns ClusterRole and
# ClusterRoleBinding argocd-cluster-scoped.
