{{- $testConfig := required "testConfig is required" .Values.testConfig }}
# test-config ConfigMap for pre-submit pods running on the build cluster.
#
# Carries the CONTENT of prow/jobs/test_config.yaml, which the control plane also mounts
# from a ConfigMap of the same name in its own test-pods namespace (generated by
# prow/jobs/kustomization.yaml). One source file, two clusters, so they cannot drift.
#
# This replaces a configMapGenerator that read the file through a `../../../` path. Only
# Flux could do that, because kustomize-controller builds with load restrictions disabled;
# Argo CD's managed capability exposes no such setting. Terraform now reads the file and
# passes the content in - see values.yaml for the full reasoning and why relocating the
# file is not an option.
#
# The name must stay exactly `test-config`: the preset-test-config preset mounts it by
# name, which is also why the generator set disableNameSuffixHash. Rendering it as a
# template rather than generating it removes the content-hash question entirely.
#
# `indent 4` under a clipped block scalar with the trailing newline trimmed reproduces the
# file byte for byte, which is what lets Argo CD adopt the live ConfigMap without a
# content change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-config
  namespace: test-pods
data:
  test_config.yaml: |
{{ $testConfig | trimSuffix "\n" | indent 4 }}
