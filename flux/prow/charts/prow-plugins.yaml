apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-plugins
  namespace: flux-system
spec:
  interval: 5m
  # SUSPENDED: this path is cut over to Argo CD (Application `prow-plugins`). kustomize-controller stops
  # reconciling, so these objects are managed solely by Argo CD.
  #
  # Declared here rather than applied with kubectl, because the root test-infra Kustomization
  # re-applies this spec: an imperative suspend is silently reverted on the next reconcile and
  # both reconcilers end up owning the same objects.
  suspend: true
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./prow/plugins/deployments
  # prune disabled ahead of the chart conversion: converting this path makes the raw
  # objects stale, and prune deletes stale objects. Must be live BEFORE the content
  # change, not alongside it (D19-P1) - which is why this is its own commit.
  #
  # The cost is that a removed object is no longer garbage-collected here, the same trade
  # every other converted path already made. What it buys is that the Deployment, Service
  # and RBAC keep running when the raw manifests stop being rendered.
  prune: false
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
