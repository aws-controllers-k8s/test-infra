apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prow-agent-workflows
  namespace: flux-system
spec:
  interval: 5m
  # SUSPENDED: this path is cut over to Argo CD (Application `prow-agent-workflows`). kustomize-controller stops
  # reconciling, so these objects are managed solely by Argo CD.
  #
  # Declared here rather than applied with kubectl, because the root test-infra Kustomization
  # re-applies this spec: an imperative suspend is silently reverted on the next reconcile and
  # both reconcilers end up owning the same objects.
  suspend: true
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./prow/agent-workflows
  # prune disabled ahead of the chart conversion, for the same reason as prow-plugins and
  # the two build-cluster paths: converting makes the raw object stale and prune deletes
  # stale objects, so this must be live BEFORE the content change (D19-P1).
  #
  # This path renders exactly one object, the agent-workflow-config ConfigMap that the
  # agent-plugin Deployment mounts. disableNameSuffixHash means the pod does not roll when
  # it changes, so a prune-deleted ConfigMap would not surface as a failing pod either -
  # the running plugin would keep its mounted copy until something restarted it.
  prune: false
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
