# Renders flux/prow/charts/prow-mirror instead of the token-substituted manifest.
#
# targetNamespace is test-pods, matching where the Job has always run. The
# template keeps its explicit metadata.namespace, so this only supplies the
# release namespace.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prow-mirror
  namespace: flux-system
spec:
  interval: 60m
  targetNamespace: test-pods
  chart:
    spec:
      chart: ./flux/prow/charts/prow-mirror
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        namespace: flux-system
      interval: 60m
  install:
    createNamespace: false
  upgrade:
    # The Job is a Helm hook with hook-delete-policy: before-hook-creation,
    # which deletes and recreates it. force is not the mechanism and would not
    # work anyway: Helm force is a replace, and the API server still rejects a
    # changed Job spec.template as immutable.
    force: false
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: ACCOUNT_ID
    targetPath: accountId
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: REGION
    targetPath: region
  - kind: ConfigMap
    name: prow-version
    valuesKey: PROW_VERSION
    targetPath: prowVersion
  - kind: ConfigMap
    name: prow-version
    valuesKey: PROW_PATCH_REVISION
    targetPath: prowPatchRevision
  - kind: ConfigMap
    name: prow-version
    valuesKey: TOOLS_VERSION
    targetPath: toolsVersion
