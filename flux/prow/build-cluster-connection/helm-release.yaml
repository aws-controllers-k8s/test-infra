# Renders flux/prow/charts/prow-build-cluster-connection instead of the
# token-substituted manifests.
#
# targetNamespace is flux-system, but every template keeps its explicit
# metadata.namespace: the Role and RoleBinding that read the ACK CRs live in
# ack-system while the Job, ServiceAccount and write RBAC live in flux-system.
# Stripping those namespaces would collapse the chart onto one namespace and break
# the cross-namespace read.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prow-build-cluster-connection
  namespace: flux-system
spec:
  # SUSPENDED: this path is cut over to Argo CD (Application of the same name, in
  # bootstrap/argocd-applications.tf). helm-controller stops reconciling, so the objects
  # are managed solely by Argo CD, while the enclosing Kustomization stays active and
  # keeps enforcing this field.
  #
  # It has to be declared here rather than applied with kubectl. The root test-infra
  # Kustomization re-applies these specs, so an imperative suspend is silently reverted
  # on the next reconcile and both reconcilers end up managing the same objects.
  # Suspending the Kustomization instead does not work either: the HelmRelease is applied
  # BY that Kustomization, so a suspended one can never deliver a suspend to its own
  # HelmRelease.
  #
  # This path survives the migration, unlike prow-build-cluster-kubeconfig which Phase 5
  # deletes: the Job discovers the build cluster endpoint and CA from the build-cluster
  # Cluster CR status and writes the build-cluster-kubeconfig ConfigMap that crier, deck,
  # sinker and prow-controller-manager mount (D16).
  #
  # ARGO CD DOES RUN THE HOOK. An earlier attempt concluded otherwise, from syncs that
  # had nothing to apply - which is not the case that matters. Argo CD skips hooks on a
  # no-op sync and runs them when a sync has work, which is the bootstrap case: this path
  # runs before Prow exists, since prow-charts dependsOn it. Verified by deleting one Role
  # and the Job: Argo CD restored the Role, re-ran the PostSync hook, and the Job rebuilt
  # build-cluster-kubeconfig byte-identically.
  #
  # Its Application is the only one with selfHeal on, because live drift is what gives the
  # Job a re-run trigger, and this chart owns only RBAC and a Job with no AWS resource
  # behind it. See the note there.
  #
  # The tracked set is the RBAC objects plus the build-cluster-resources-application
  # ConfigMap, and it spans flux-system, ack-system, prow and argocd -
  # the Job reads the CR in one namespace and writes the ConfigMap in another - so the
  # Application's destination namespace is only a default. Applying them needs
  # flux/argocd/namespaced-rbac.yaml, which must stay in place.
  suspend: true
  interval: 60m
  targetNamespace: flux-system
  chart:
    spec:
      chart: ./flux/prow/charts/prow-build-cluster-connection
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        namespace: flux-system
      interval: 60m
  install:
    createNamespace: false
  upgrade:
    # The Job is a Helm hook with hook-delete-policy: before-hook-creation,
    # which deletes and recreates it. force is not the mechanism and would not
    # work anyway: Helm force is a replace, and the API server still rejects a
    # changed Job spec.template as immutable.
    force: false
  # THIS CANNOT BE UNSUSPENDED AS IT STANDS, and that is a deliberate consequence rather
  # than an oversight. The chart now also composes the prow-build-cluster-resources
  # Application, which needs the CONTENT of prow/jobs/test_config.yaml as a value.
  # valuesFrom reads ConfigMaps and Secrets, so Flux has no way to supply a file from the
  # repo; Terraform does, with file(), through the Application's helm.values. Unsuspending
  # would fail on `testConfig is required` - loudly, at render time, which is the right
  # failure. Phase 5 deletes this file.
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: PROW_IMAGES_REPO_URI
    targetPath: prowImagesRepoUri
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: STACK_NAME
    targetPath: stackName
  # Repo coordinates for the composed Application's source. These three do exist in
  # self-managed-vars, so they are wired here for completeness even though the path is
  # suspended - leaving them out would make the file look like it had simply not kept up.
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: TEST_INFRA_ORG
    targetPath: testInfraOrg
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: TEST_INFRA_REPO
    targetPath: testInfraRepo
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: TEST_INFRA_BRANCH
    targetPath: testInfraBranch
