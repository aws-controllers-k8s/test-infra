# Renders flux/prow/charts/prow-build-cluster-kubeconfig instead of the
# token-substituted manifest.
#
# targetNamespace is flux-system, NOT ack-system: this ConfigMap is consumed by
# kustomize-controller itself via kubeConfig.configMapRef on the two
# build-cluster Kustomizations, so it has to sit in the namespace the controller
# reads from. Placing it anywhere else silently breaks the remote apply.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prow-build-cluster-kubeconfig
  namespace: flux-system
spec:
  interval: 60m
  targetNamespace: flux-system
  chart:
    spec:
      chart: ./flux/prow/charts/prow-build-cluster-kubeconfig
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        namespace: flux-system
      interval: 60m
  install:
    createNamespace: false
  upgrade:
    # No AWS resource behind this ConfigMap, but a replace would briefly remove
    # the kubeconfig that both build-cluster Kustomizations depend on.
    force: false
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: ACCOUNT_ID
    targetPath: accountId
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: REGION
    targetPath: region
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: STACK_NAME
    targetPath: stackName
