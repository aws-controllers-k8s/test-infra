# --- Flux ECR Pull-Through Cache (depends on capability) ---
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ack-flux
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/ack/flux
  # prune deliberately disabled for the Argo CD migration: converting this path
  # to a chart makes every raw object stale, and prune deletes stale objects.
  # Must be live before any content change (see docs, D19-P1).
  prune: false
  deletionPolicy: WaitForTermination
  # targetNamespace removed with the chart conversion: it rewrites the namespace
  # of every object this Kustomization applies, including the HelmRelease itself,
  # which would strand the HelmRelease in ack-system. The chart's objects are
  # placed by HelmRelease.spec.targetNamespace instead.
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
  dependsOn:
  - name: ack-capability
  wait: true
