# Prometheus + Grafana monitoring stack for Prow
# Deploys kube-prometheus-stack with Prow-specific scrape configs and dashboards
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/prometheus
  prune: true
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
  dependsOn:
  - name: prow-charts
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-dashboards
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./prow/prometheus-dashboards
  # prune disabled ahead of the Argo CD cutover (D19-P1), for the same reason as prow-crds:
  # this path is not converted, Argo CD reads the same directory, and cutover is suspending
  # this Kustomization. With prune enabled that would garbage-collect the dashboards ConfigMap.
  prune: false
  targetNamespace: prometheus
  dependsOn:
  - name: prometheus
