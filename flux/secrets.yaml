# Prow secrets (SecretProviderClass + RBAC) - depends on the Secrets Store CSI
# addon being installed by ACK via self-managed-cluster.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/secrets
  # prune deliberately disabled for the Argo CD migration: this path is converted or
  # deleted later in the sequence, and prune deletes objects that a conversion makes
  # stale. Deleting a Kustomization with prune enabled also garbage-collects its
  # inventory, so this must be false before any later stage removes it.
  prune: false
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
  dependsOn:
  - name: ack-addons
  - name: ack-pod-identities
