# Prow secrets (SecretProviderClass + RBAC) - depends on the Secrets Store CSI
# addon being installed by ACK via self-managed-cluster.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/secrets
  # prune disabled ahead of the Argo CD cutover (D19-P1). This path is not converted - it has no
  # tokens, so Argo CD reads this same kustomize directory - which means cutover is suspending
  # this Kustomization rather than changing content, and prune is what makes that dangerous:
  # Flux garbage-collects what a Kustomization applied when it is deleted. Here that is the CSI
  # driver's ClusterRole and both SecretProviderClasses, so pruning would stop every Prow
  # component and every job pod from obtaining its GitHub credentials.
  prune: false
  # SUSPENDED: cut over to Argo CD (Application `secrets`). Argo CD can apply the ClusterRole here
  # only because cluster-scoped-rbac.yaml grants it all seven secrets verbs cluster-wide - see the
  # block there, including the exit condition, before changing anything on this path.
  suspend: true
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
  dependsOn:
  - name: ack-addons
  - name: ack-pod-identities
