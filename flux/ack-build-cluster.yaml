# Build-cluster ACK resources (all-ACK, same account as the control plane).
#
# A single Flux Kustomization reconciles the whole build-cluster tree. Unlike
# the control-plane cluster (Terraform shell + ACK day-2), the build cluster is
# provisioned end-to-end by the EC2/EKS/IAM controllers from these CRs — no
# Terraform. Internal ordering needs no Flux dependsOn: the day-2 CRs clusterRef
# the create-path Cluster CR, so ACK waits for status ACTIVE on its own.
#
# dependsOn ack-capability + ack-capability-role so the capability role's
# widened EC2/EKS scope lands before ACK attempts any creates.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ack-build-infra
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/ack/build-cluster
  # prune deliberately disabled for the Argo CD migration: converting this path
  # to a chart makes every raw object stale, and prune deletes stale objects.
  # Must be live before any content change (see docs, D19-P1).
  prune: false
  deletionPolicy: WaitForTermination
  # targetNamespace removed with the chart conversion: it would rewrite the
  # HelmRelease's own namespace, and valuesFrom always resolves against the
  # HelmRelease's namespace (it has no namespace field), so a stranded copy in
  # ack-system cannot read flux-system/self-managed-vars. Objects are placed by
  # HelmRelease.spec.targetNamespace instead.
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
  dependsOn:
  - name: ack-capability
  - name: ack-capability-role
  wait: true
  timeout: 30m
